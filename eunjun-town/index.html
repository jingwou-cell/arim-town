<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>은준이 마을</title>
<meta name="description" content="수학·체스·물리·잡지식·몸 미션을 하며 생각하는 힘을 기르는 은준이의 마을">
<meta name="theme-color" content="#1b2a55">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="은준이 마을">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Sunflower:wght@500;700&family=Jua&family=Black+Han+Sans&family=Nanum+Gothic:wght@700;800&family=Gamja+Flower&family=Gowun+Dodum&family=Do+Hyeon&family=Orbit&family=Gaegu:wght@700&family=Dongle:wght@700&family=Hi+Melody&family=Cute+Font&family=Poor+Story&family=Yeon+Sung&family=Gugi&family=Single+Day&family=IBM+Plex+Sans+KR:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html{-webkit-text-size-adjust:100%}
  :root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0;font-size:14px;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<style>
  /* 아림 마을과 같은 틀: 하늘·잔디 배경, 비스듬히 내려다보는 입체 지도, 걸어가는 캐릭터, 둥근 흰 카드 */
  :root{--ink:#33302e;--soft:#7d736c;--line:#e6ddd4;--accent:#ff8a65;--jua:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;background:linear-gradient(#bfe4ff 0,#e6f5ff 55%,#d9f0cf 55.1%,#e9f7e2 100%)}
  button{font-family:inherit;color:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #3a6fb0;outline-offset:2px}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
  #home,#place{max-width:520px;margin:0 auto}
  #home{text-align:center}
  #home h1{font-family:var(--jua);font-weight:normal;font-size:34px;margin:6px 0 2px;color:#2c6e9b}
  #home .sub{color:#5f7686;font-size:15px}
  #map{margin:14px -6px 0;background:linear-gradient(#cfeaff,#e9f6ff 45%,#eaf7e2);border-radius:22px;padding:4px 0 2px;box-shadow:0 3px 0 #c6dcec;overflow:hidden}
  #mapsvg{width:100%;display:block;touch-action:manipulation}
  #mapsvg .bd{cursor:pointer}
  #mapsvg .bsign{filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
  #mapsvg .bd.hop{animation:hop .45s ease}
  @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}70%{transform:translateY(2px)}}
  #mapsvg .win{animation:blink 6s ease-in-out infinite}
  @keyframes blink{0%,70%,100%{opacity:1}80%{opacity:.45}}
  #me{transition:transform 2s linear;pointer-events:none}
  #me.walk .bob{animation:bob .42s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  #snd{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));z-index:30;width:36px;height:36px;border:none;border-radius:50%;background:#ffffffe0;font-size:16px;box-shadow:0 1px 0 #c9d6df;padding:0}
  .hcard{background:#fff;border-radius:20px;padding:14px 16px;margin-top:14px;text-align:left;box-shadow:0 3px 0 #c6dcec;font-size:16px;line-height:1.5}
  .hcard h3{font-family:var(--jua);font-weight:normal;font-size:20px;margin:0 0 4px}
  .hcard .big{font-size:18px}
  .hstat{margin-top:14px;font-size:14px;color:#5f7686}
  .strow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #f0ebe5;font-size:15px}
  .strow:first-of-type{border-top:none}
  .strow .r{font-size:13px;color:#b0661a}
  .strow .n{font-size:13px;color:#5f7686;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
  .holdbtn{position:relative;overflow:hidden;display:block;width:100%;margin-top:10px;border:2px dashed #b7a5f0;border-radius:14px;padding:12px;font-family:var(--jua);font-size:16px;background:#f4f0ff;color:#5b43b5;touch-action:none;user-select:none;-webkit-user-select:none}
  .holdbtn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:#cfc2ff}
  .holdbtn.holding::before{width:100%;transition:width 2s linear}
  .holdbtn span{position:relative}
  /* 건물 안 */
  .backhome{display:block;border:none;background:#ffffffc0;border-radius:999px;padding:7px 13px;font-family:var(--jua);font-size:15px;color:#6b625b}
  header.bh{text-align:center;padding:6px 0 0}
  header.bh h1{font-family:var(--jua);font-weight:normal;font-size:28px;margin:4px 0}
  .prog{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--soft)}
  .prog span{background:#fff;border-radius:999px;padding:5px 11px;box-shadow:0 1px 0 #d9d0c8}
  .prog .rank{font-family:var(--jua);color:#b0661a;background:#fff3cf}
  nav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
  nav button{flex:1 1 30%;min-width:0;font-family:var(--jua);font-size:15px;border:none;border-radius:16px;padding:11px 2px;background:#ffffffb0;color:var(--soft);word-break:keep-all}
  nav button.on{background:var(--accent);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  .qz{background:#fff;border-radius:24px;padding:18px;box-shadow:0 3px 0 var(--line);margin-top:10px}
  .pt{display:flex;gap:12px;align-items:flex-start}
  .pt .face{font-size:52px;line-height:1}
  .bubble{background:#fff3e8;border-radius:18px;padding:12px 14px;font-size:18px;line-height:1.55;flex:1;min-width:0}
  .bubble b{font-family:var(--jua);font-weight:normal}
  .bigq{font-family:var(--jua);font-size:44px;text-align:center;margin:14px 0 6px;letter-spacing:1px}
  .qtitle{font-family:var(--jua);font-size:21px;margin:16px 0 8px;color:#d9603f}
  .arow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:10px}
  .arow input{font-family:var(--jua);font-size:26px;width:130px;max-width:100%;text-align:center;border:3px solid #e6ddd4;border-radius:14px;padding:8px;background:#fffdf9;color:var(--ink)}
  .unit{font-family:var(--jua);font-size:20px}
  .opts{display:grid;gap:8px;margin-top:10px}
  .opt{border:none;border-radius:16px;padding:13px;font-family:var(--jua);font-size:19px;background:#eef4ff;text-align:left}
  .opt.right{background:#d8f5ea;color:#22795f}
  .opt.wrong{background:#f1ecea;color:#b9a99e;animation:shake .35s}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .msg{min-height:24px;margin-top:8px;font-size:16px;color:#a5624a;text-align:center}
  .result{background:#eafaf4;border-radius:18px;padding:14px 16px;margin-top:12px;font-size:17px;line-height:1.55}
  .result b{font-family:var(--jua);font-weight:normal;font-size:20px;color:#22795f}
  .btn{font-family:var(--jua);font-size:17px;border:none;border-radius:14px;padding:11px 15px;background:var(--accent);color:#fff}
  .btn.line{background:#eef4ff;color:#3a6fb0}
  .result + .btn{margin-top:10px}
  .scene{font-size:19px;line-height:1.6;background:#fff3e8;border-radius:18px;padding:14px 16px}
  .scene .big{font-size:46px;display:block;text-align:center;margin-bottom:4px}
  .stamps{text-align:center;font-size:15px;line-height:1.5;margin-top:12px;color:var(--soft)}
  textarea{width:100%;min-height:90px;margin-top:10px;font:inherit;font-size:18px;border:3px solid #e6ddd4;border-radius:14px;padding:10px;background:#fffdf9;color:var(--ink)}
  .item{background:#fff4f1;border-radius:16px;padding:12px 14px;margin-bottom:8px;font-size:17px;line-height:1.55}
  .item b{display:block;font-family:var(--jua);font-weight:normal;font-size:18px;margin-bottom:2px}
  .item small{color:var(--soft)}
  /* 분수 · 격자 곱셈 · 구구단 */
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 4px}
  .frac i{font-style:normal;border-top:3px solid currentColor;padding:0 6px}
  .fbar{display:flex;max-width:320px;margin:10px auto 0;border:3px solid #d9cfc4;border-radius:10px;overflow:hidden;height:34px}
  .fbar i{flex:1;border-right:2px solid #d9cfc4;background:#fffdf9}
  .fbar i:last-child{border-right:none}
  .fbar i.a{background:#ffb86b}.fbar i.b{background:#7fc4f5}
  .fbar i.x{background:repeating-linear-gradient(45deg,#ffb86b,#ffb86b 4px,#fffdf9 4px,#fffdf9 8px)}
  .lat{display:grid;grid-template-columns:84px 84px 34px;grid-template-rows:34px 84px 84px;justify-content:center;margin-top:12px;font-family:var(--jua);font-size:24px}
  .lat .hd{display:flex;align-items:center;justify-content:center;color:#b0661a}
  .lat .lc{position:relative;display:flex;align-items:center;justify-content:center;border:3px solid #e0b060;margin:-1.5px;background:linear-gradient(to bottom right,#fffdf9 calc(50% - 1.5px),#e0b060 calc(50% - 1.5px),#e0b060 calc(50% + 1.5px),#fffdf9 calc(50% + 1.5px))}
  .lat .lc input{width:58px;font-family:var(--jua);font-size:22px;text-align:center;border:2px solid #e6ddd4;border-radius:10px;padding:4px;background:#fff;color:var(--ink)}
  .lat .lc .t{position:absolute;left:12px;top:4px;color:#22795f}
  .lat .lc .o{position:absolute;right:12px;bottom:4px;color:#22795f}
  .chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:12px}
  .chips button{border:none;border-radius:999px;padding:6px 11px;background:#f3eee9;font-family:var(--jua);font-size:15px}
  .chips button.on{background:var(--accent);color:#fff}
  /* 도전 탑 · 아이템 */
  .bt{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f6efff;border-radius:18px;padding:10px 12px}
  .bt .side{flex:1;min-width:0;text-align:center}
  .bt .vs{font-family:var(--jua);font-size:20px;color:#9a7fe0}
  .bt .mon{font-size:52px;line-height:1.1}
  .bt b{font-family:var(--jua);font-weight:normal;display:block;font-size:15px}
  .hp{font-size:16px;overflow-wrap:anywhere}
  .inv{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .inv button{flex:1 1 30%;min-width:0;border:none;border-radius:14px;padding:9px 4px;background:#fff3cf;font-family:var(--jua);font-size:14px;word-break:keep-all}
  .inv button:disabled{opacity:.45}
  .shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sitem{border:none;border-radius:16px;background:#fffdf9;padding:10px 4px;box-shadow:0 3px 0 #ecd9ad;text-align:center;min-width:0}
  .sitem .e{font-size:34px;line-height:1.1}
  .sitem .n{font-family:var(--jua);font-size:15px;word-break:keep-all}
  .sitem .p{font-size:14px;color:#b0761a}
  .sitem .own{font-size:12px;color:#2f9b7b}
  .sitem.poor{opacity:.55}
  .wkrow{display:flex;align-items:center;gap:10px;width:100%;border:none;border-radius:14px;padding:11px 12px;margin-top:8px;background:#fff8d9;text-align:left;font-size:16px}
  .wkrow.done{background:#eafaf4;color:#22795f}
  .wkrow span:first-child{font-size:22px}
  .x{float:right;border:none;background:#f5ece6;border-radius:50%;width:38px;height:38px;font-size:17px}
  /* 새 건물: 공사 진행 · 코딩 · 탐정 */
  .nbar{height:12px;background:#eee7e0;border-radius:99px;margin:8px 0 4px;overflow:hidden}
  .nbar i{display:block;height:100%;background:#ffb300;border-radius:99px}
  .cell{display:flex;align-items:center;justify-content:center}
  .board.fac{border-color:#1f8f84}.fac .cell.l{background:#e8f7f5}.fac .cell.d{background:#c4e9e3}
  .fac .cell{font-size:30px}
  .code{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;min-height:52px;background:#f3f7ff;border-radius:14px;padding:8px;margin-top:10px}
  .code span,.code .blk{font-size:24px;line-height:1.1;background:#fff;border-radius:10px;padding:4px 7px;border:none;box-shadow:0 2px 0 #cfe0ee}
  .code .blk small{display:block;font-size:11px;color:#7d736c;font-family:var(--jua)}
  .code .blk.wrong{background:#f1ecea;opacity:.55}.code .blk.right{background:#d8f5ea}
  .code em{color:#9a8f87;font-size:14px;font-style:normal}
  .arow .btn.ar{font-size:24px;padding:6px 14px}
  .sus{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .sus .opt{text-align:center;padding:10px 6px}
  .sus .opt .e{font-size:40px;display:block;line-height:1.15}
  .sus .opt small{display:block;font-family:'Gowun Dodum',sans-serif;font-size:14px;line-height:1.45;margin-top:2px}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:3px;border:1px solid #0002}
  .clue{background:#f3f7ff;border-radius:12px;padding:9px 12px;font-size:17px;margin-top:6px;line-height:1.5}
  .twin{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .twin div{background:#fffdf9;border:2px solid #ecd9ad;border-radius:16px;padding:10px;text-align:center;font-size:17px}
  .twin b{display:block;font-family:var(--jua);font-weight:normal;font-size:22px}
  /* 체스판 */
  .board{display:grid;grid-template-columns:repeat(5,1fr);max-width:310px;margin:12px auto 0;border:4px solid #6b5a8e;border-radius:12px;overflow:hidden}
  .cell{aspect-ratio:1;border:none;padding:0;font-size:34px;line-height:1;color:#2b2140}
  .cell.l{background:#f3eeff}.cell.d{background:#c3b2ee}
  .cell.hit{background:#9fe3c2}
  .cell.tip{box-shadow:inset 0 0 0 4px #ffb300}
  /* 기록 막대 */
  .bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:8px}
  .bars div{flex:1;max-width:44px;background:#7fd1b9;border-radius:8px 8px 0 0;position:relative;min-height:6px}
  .bars div span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
  .tablebox{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #f0ebe5;vertical-align:top}
  th{color:var(--soft);font-weight:normal}
  /* 겹침 창 */
  .ov{position:fixed;inset:0;z-index:40;background:rgba(40,36,33,.45);display:none;align-items:center;justify-content:center;padding:16px}
  .ov.on{display:flex}
  .ovc{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:480px;max-height:90%;overflow:auto;text-align:left}
  .ovc h2{font-family:var(--jua);font-weight:normal;font-size:23px;margin:0 0 2px;color:#d9603f}
  .avrow{margin-top:8px}
  .avrow b{display:block;font-family:var(--jua);font-weight:normal;font-size:15px;color:#7d736c;margin-bottom:3px}
  .avrow .sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d9d0c8;margin-right:6px}
  .avrow .sw.on{box-shadow:0 0 0 3px #ff8a65}
  .avrow .chipb{border:none;border-radius:999px;padding:7px 12px;margin:0 5px 5px 0;background:#f3eee9;font-family:var(--jua);font-size:15px}
  .avrow .chipb.on{background:#ff8a65;color:#fff}
  .hbtn{display:block;width:100%;margin-top:12px;border:none;border-radius:14px;padding:12px;font-family:var(--jua);font-size:18px;background:#ff8a65;color:#fff}
  @media (min-width:700px){
    .ovc{max-width:600px}
  }
  @media (prefers-reduced-motion:reduce){#mapsvg .win,#me.walk .bob,#mapsvg .bd.hop{animation:none}}


  /* 단계 알림 · 공격 · 공항 · 집 안 */
  #toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:60;background:var(--zap);color:var(--navy);border:3px solid var(--navy);box-shadow:0 5px 0 var(--navy);border-radius:18px;padding:10px 18px;font-family:var(--disp);font-size:20px;text-align:center;transition:transform .35s;max-width:calc(100% - 32px)}
  #toast.on{transform:translate(-50%,0)}
  #toast small{display:block;font-family:var(--jua);font-size:13px;font-weight:700}
  .bt .mon.hit{animation:hitm .55s}
  @keyframes hitm{20%{transform:translateX(-8px) rotate(-10deg) scale(1.1);filter:brightness(2)}45%{transform:translateX(8px) rotate(8deg)}70%{transform:translateX(-4px)}}
  .chg{font-size:13px;margin-top:2px;letter-spacing:1px}
  .atk{display:flex;margin-top:10px}
  .btn.spc{flex:1;background:linear-gradient(#ff8a3d,#e8412c);color:#fff;font-size:18px}
  .btn.spc:disabled{background:#cfd5e2;color:#6f7891;box-shadow:0 2px 0 var(--navy)}
  .ctg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .cty{border:3px solid var(--navy);border-radius:16px;background:#fff;padding:8px 4px;font-family:var(--jua);font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--navy);display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--navy);min-width:0;word-break:keep-all}
  .cty span{font-size:34px;line-height:1.15}
  .cty small{font-size:12px;color:#14855f}
  .cty.open{background:#fff3c4;animation:pulse 1.6s infinite}
  .cty.lock{background:#e6e9f2;color:#9aa3b8;box-shadow:none;border-color:#c4cad8}
  @keyframes pulse{50%{transform:scale(1.05)}}
  .ccard{background:linear-gradient(#dff6ff,#fff);border:3px solid var(--navy);border-radius:18px;padding:14px;text-align:center}
  .ccard .flag{font-size:64px;line-height:1.1}
  .ccard h3{font-family:var(--disp);font-weight:400;font-size:26px;margin:4px 0;color:var(--navy)}
  .ccard .facts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
  .ccard .facts div{background:#fff;border:2px solid #cfe3ee;border-radius:12px;padding:6px;font-size:14px;min-width:0}
  .ccard .facts b{display:block;font-size:18px;word-break:keep-all}
  .ccard p{font-size:17px;line-height:1.6;margin:6px 0 0;text-align:left}
  .stampbig{width:190px;height:190px;margin:6px auto 12px;border:6px double #c0392b;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#c0392b;transform:rotate(-8deg);font-size:56px;line-height:1.1;background:#fff}
  .stampbig b{font-family:var(--disp);font-weight:400;font-size:24px}
  .stampbig small{font-size:12px;font-weight:700}
  .passbook{background:#1f3a7a;border:3px solid var(--navy);border-radius:18px;padding:14px;color:#fff}
  .pbh{font-family:var(--disp);font-size:22px;color:var(--zap)}
  .pbh small{font-family:var(--jua);font-size:12px;letter-spacing:2px;color:#c9d8ff;margin-left:6px}
  .pbn{font-size:14px;color:#c9d8ff;margin-top:2px}
  .pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;background:#fffaf0;border-radius:12px;padding:10px}

<script>
(function(){
const g=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const day=()=>{const n=new Date();return Math.floor((n.getTime()-n.getTimezoneOffset()*60000)/86400000);};
const stamp=()=>{const n=new Date();return (n.getMonth()+1)+"/"+n.getDate()+" "+String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");};
const shade=(hex,f)=>{const n=parseInt(hex.slice(1),16),c=v=>Math.max(0,Math.min(255,Math.round(v*f)));return "rgb("+c(n>>16)+","+c(n>>8&255)+","+c(n&255)+")";};

/* 저장 */
const fresh=()=>({st:{m:0,p:0,c:0,g:0,w:0,t:0,f:0,d:0,b:0,s:0,k:0,a:0,z:0,l:0},lv:{},mail:[],lib:{},lvp:{},pass:{},passMv:{},decor:{},log:[],why:[],rec:{},av:{kind:0,blk:0,hair:7,hc:0,skin:0,shirt:10,acc:0,top:6,pants:5},at:"",mute:false,bodyDay:0,body:0,spent:0,inv:{shield:0,potion:0,lens:0,bolt:0,bomb:0},wk:{id:0,done:{},bonus:false},dy:{id:0,done:{},bonus:false},dyDone:0,open:{},cons:null,newly:"",days:{},wins:0,dan:0,gift:false});
let M=fresh();
try{const v=JSON.parse(localStorage.getItem("eunjun-town1")||"null");if(v){M=Object.assign(fresh(),v);M.st=Object.assign(fresh().st,v.st||{});M.inv=Object.assign(fresh().inv,v.inv||{});M.av=Object.assign(fresh().av,v.av||{});}}catch(e){}
if(!M.gift){M.gift=true;M.inv.shield++;M.inv.potion++;M.inv.lens++;}
if(!M.gift2){M.gift2=true;M.inv.bolt=(M.inv.bolt||0)+1;}
["lv","lvp","pass","passMv","decor"].forEach(k=>{M[k]=M[k]||{};});M.mail=M.mail||[];M.lib=M.lib||{};
const bal=()=>total()-(M.spent||0);
const save=()=>{try{localStorage.setItem("eunjun-town1",JSON.stringify(M));}catch(e){}};
const total=()=>Object.values(M.st).reduce((a,b)=>a+b,0);
const RANKS=[[0,"🎒 새내기 탐험가"],[10,"🔍 꼬마 연구원"],[30,"🧪 마을 박사"],[60,"♟️ 생각 마스터"],[100,"👑 은준 마스터"],[160,"🌌 우주 탐험가"],[250,"🏆 전설의 은준"]];
const rank=n=>{let r=RANKS[0][1];RANKS.forEach(x=>{if(n>=x[0])r=x[1];});return r;};
const nextRank=n=>RANKS.find(x=>x[0]>n);
const PR=["와, 생각하는 힘이 대단해! 🌟","은준 박사님 최고! 🧪","스스로 알아냈구나! 👏","머리가 반짝반짝해! 💡","끝까지 생각했네, 멋져! 🚀"];
function bump(n){const t=day();M.days=M.days||{};const e=M.days[t]=M.days[t]||{s:0,q:0};e.s+=n;return e;}
const LVMAX=10,lvNeed=L=>4+L;
function lv(k){return M.lv[k]||1;}
function toast(h){const t=g("toast");t.innerHTML=h;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),3400);}
function lvStep(k){if(!PL[k]||k==="r"||k==="h")return;const L=lv(k);if(L>=LVMAX)return;M.lvp[k]=(M.lvp[k]||0)+1;
  if(M.lvp[k]>=lvNeed(L)){M.lv[k]=L+1;M.lvp[k]=0;(M.lvlog=M.lvlog||[]).push({d:stamp(),k:k,L:L+1});setTimeout(()=>{SFX("fanfare");toast(`🎉 ${PL[k].emoji} ${PL[k].name} ${L+1}단계!<small>문제가 한 단계 어려워져요. 도전!</small>`);},600);}}
function star(k,what,n){
  const before=rank(total());M.st[k]=(M.st[k]||0)+(n||1);bump(n||1).q++;lvStep(k);
  M.log.push({d:stamp(),k:k,what:what});if(M.log.length>5000)M.log.shift();save();drawProg();
  if(rank(total())!==before)setTimeout(()=>SFX("fanfare"),400);
}

/* 효과음 */
let AC=null,lastS={};
const tone=(f,t0,d,type,v)=>{const o=AC.createOscillator(),gn=AC.createGain();o.type=type||"triangle";o.frequency.value=f;
  gn.gain.setValueAtTime(0,AC.currentTime+t0);gn.gain.linearRampToValueAtTime(v||.16,AC.currentTime+t0+.015);gn.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t0+d);
  o.connect(gn);gn.connect(AC.destination);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+d+.03);};
const SND={ok:()=>{tone(660,0,.12);tone(880,.1,.18);},no:()=>{tone(196,0,.16,"sine",.2);tone(165,.12,.2,"sine",.2);},
  stamp:()=>{tone(120,0,.12,"sine",.3);tone(1047,.1,.25);tone(1319,.22,.3);},fanfare:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.22));tone(1319,.55,.4);},
  pop:()=>{tone(520,0,.07,"sine",.12);},tick:()=>{tone(740,0,.06,"triangle",.1);}};
function SFX(n){if(M.mute||!SND[n])return;const now=Date.now();if(lastS[n]&&now-lastS[n]<150)return;lastS[n]=now;
  try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();}if(AC.state==="suspended")AC.resume();SND[n]();}catch(e){}}
function drawSnd(){g("snd").textContent=M.mute?"🔇":"🔊";}
g("snd").onclick=()=>{M.mute=!M.mute;save();drawSnd();if(!M.mute)SFX("pop");};

/* 🔤 글씨체 고르기 */
const FONTS=[["기본 (푸어 스토리 + IBM 플렉스)","'Poor Story'","'IBM Plex Sans KR'",500],["베이글 + 해바라기","'Bagel Fat One'","'Sunflower'",500],["동글동글 (주아)","'Jua'","'Jua'",400],["게임 타이틀 (검은고딕 + 나눔고딕)","'Black Han Sans'","'Nanum Gothic'",700],["말랑 손글씨 (감자꽃 + 고운돋움)","'Gamja Flower'","'Gowun Dodum'",400],["로봇·미래 (도현 + 오르빗)","'Do Hyeon'","'Orbit'",400],["크레용 손글씨 (개구)","'Gaegu'","'Gaegu'",700],["말랑 동글이 (동글 + 해바라기)","'Dongle'","'Sunflower'",500],["노래하듯 (하이멜로디 + IBM 플렉스)","'Hi Melody'","'IBM Plex Sans KR'",500],["귀요미 (큐트 폰트 + IBM 플렉스)","'Cute Font'","'IBM Plex Sans KR'",500],["공책 글씨 (푸어 스토리)","'Poor Story'","'Poor Story'",400],["붓 캘리 (연성 + 나눔고딕)","'Yeon Sung'","'Nanum Gothic'",700],["우주 기지 (구기 + IBM 플렉스)","'Gugi'","'IBM Plex Sans KR'",600],["통통 튀는 (싱글데이 + 해바라기)","'Single Day'","'Sunflower'",500]];
function applyFont(i){const f=FONTS[i]||FONTS[0],fb="'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
  g("fcss").textContent=`:root{--disp:${f[1]},${fb};--jua:${f[2]},${fb}}body{font-family:${f[2]},${fb};font-weight:${f[3]}}`;}
function fontPick(){const c=g("ovc");g("ov").classList.add("on");
  const draw=()=>{c.innerHTML=`<h2>가 글씨체 고르기</h2><div style="font-size:14px;color:#6f7891">누르면 바로 바뀌어요. 언제든 다시 바꿀 수 있어요.</div>`+FONTS.map((f,i)=>`<button class="fopt${(M.font||0)===i?" on":""}" data-i="${i}"><small>${i+1}. ${f[0]}${(M.font||0)===i?" · 사용 중":""}</small><div class="ft" style="font-family:${f[1]},sans-serif">은준이 마을</div><div class="fb" style="font-family:${f[2]},sans-serif;font-weight:${f[3]}">자전거가 시속 20km로 3시간 가면 몇 km? 37 × 12 = 444</div></button>`).join("")+`<button class="hbtn" id="fOk">완료</button>`;
    c.querySelectorAll(".fopt").forEach(b=>b.onclick=()=>{M.font=+b.dataset.i;save();applyFont(M.font);SFX("pop");draw();});
    g("fOk").onclick=()=>{g("ov").classList.remove("on");if(cur==="home")homeDraw();};};
  draw();}
g("fnt").onclick=()=>{SFX("pop");fontPick();};
if(!M.fontV2){M.fontV2=1;M.font=0;save();}
if(!M.blkV1){M.blkV1=1;Object.assign(M.av,{blk:0,hair:7,hc:0,skin:0,top:6,shirt:10,pants:5});save();}
applyFont(M.font||0);

/* ✅ 스스로 확인 — 엄마를 부르지 않고, 끝나면 엄마 보고서에 올라가요 */
function selfOk(el,label,cb,pre){if(!el)return;el.innerHTML=`<button class="selfbtn" type="button">✅ ${label}</button>`;
  el.firstChild.onclick=()=>{const er=pre&&pre();if(er){g("msg").textContent=er;SFX("no");return;}SFX("pop");
    el.innerHTML=`<div class="pledge"><b>🤙 은준이 약속</b>정말로 했어? 엄마 보고서에 그대로 올라가요.<div class="arow"><button class="btn" data-y>응, 진짜 했어!</button><button class="btn line" data-n>아직이야</button></div></div>`;
    el.querySelector("[data-y]").onclick=()=>{SFX("stamp");cb();};el.querySelector("[data-n]").onclick=()=>{SFX("pop");selfOk(el,label,cb,pre);};};}
function momQ(t,kind){M.chk=M.chk||[];M.chk.push({d:stamp(),t:t,ok:0,k:kind||"body"});if(M.chk.length>500)M.chk.shift();save();}
/* ⏱️ 혼자 쓰는 타이머 (스톱워치 / 카운트다운) */
function timerUI(el,mode,secs,onEnd){if(!el)return;let iv=null,t0=0;const stop=()=>{clearInterval(iv);iv=null;};
  const alive=()=>document.body.contains(el);
  const idle=()=>{el.innerHTML=`<div class="tmr"><span class="clock">${mode==="sw"?"0.0":secs}</span><button class="btn" data-go>${mode==="sw"?"⏱️ 스톱워치 시작":"⏱️ "+(secs>=60?secs/60+"분":secs+"초")+" 타이머 시작"}</button><small>${mode==="sw"?"시작을 누르고, 끝나면 멈춤!":"3, 2, 1 하고 시작해요"}</small></div>`;el.querySelector("[data-go]").onclick=go;};
  const go=()=>{SFX("pop");const ck=()=>el.querySelector(".clock");
    if(mode==="sw"){t0=Date.now();el.innerHTML=`<div class="tmr"><span class="clock go">0.0</span><button class="btn" data-st>⏹️ 멈춤</button></div>`;
      el.querySelector("[data-st]").onclick=()=>{stop();const v=Math.round((Date.now()-t0)/1000);SFX("ok");onEnd(v);el.innerHTML=`<div class="tmr"><span class="clock">${v}초</span><button class="btn line" data-go>다시 재기</button><small>기록 칸에 적어 두었어!</small></div>`;el.querySelector("[data-go]").onclick=go;};
      iv=setInterval(()=>{if(!alive())return stop();ck().textContent=((Date.now()-t0)/1000).toFixed(1);},100);}
    else{let pre=3;el.innerHTML=`<div class="tmr"><span class="clock go">3</span><small>준비…</small></div>`;
      iv=setInterval(()=>{if(!alive())return stop();if(pre>0){pre--;if(pre>0){ck().textContent=pre;SFX("tick");return;}t0=Date.now();SFX("ok");el.querySelector("small").textContent="시작! 세면서 해 봐";}
        const left=Math.max(0,secs-Math.floor((Date.now()-t0)/1000));ck().textContent=left;
        if(left<=0){stop();SFX("fanfare");el.innerHTML=`<div class="tmr"><span class="clock">끝!</span><small>몇 번 했는지 기록 칸에 적어 줘</small><button class="btn line" data-go>다시</button></div>`;el.querySelector("[data-go]").onclick=go;}},1000);}};
  idle();}
/* 2초 꾹 누르기 (보호자만 쓰는 곳: 미리 열기·편지) */
function hold(btn,cb){let t=null;const stop=()=>{clearTimeout(t);t=null;btn.classList.remove("holding");};
  btn.addEventListener("pointerdown",e=>{e.preventDefault();btn.classList.add("holding");t=setTimeout(()=>{stop();SFX("stamp");cb();},2000);});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>btn.addEventListener(ev,stop));
  btn.addEventListener("contextmenu",e=>e.preventDefault());}

/* 캐릭터 */
const AV={kind:["은준이","수달 달이","공룡 티노","로봇 삐삐","여우 루루"],hair:["짧은 머리","바가지 머리","삐죽 머리","곱슬머리","스포츠 머리","옆 가르마","높이 세운 머리","은준이 머리"],hc:["#2b2220","#5a3a22","#8a5a33","#e0b04a","#d9502f","#2f6fd6","#2e9e5b","#8a5bd6"],skin:["#ffe0c7","#f6cfa8","#e8b88f","#c98e62","#9c6a43"],top:["티셔츠","줄무늬 티","후드티","축구 유니폼","우주복","로봇 갑옷","교복 재킷"],shirt:["#5aa9f0","#ff8a65","#57c79b","#b79cf0","#ffcf6b","#e74c3c","#2c3e50","#1abc9c","#ff6fb5","#f5f5f5","#8e2a35"],pants:["#3b4a7a","#2d2d2d","#7a5230","#2e7d32","#8e99a8","#cdb48e"],blk:["⬛ 네모 블록","⚪ 동글동글"],acc:["없음","안경","모자","망토","헤드폰","왕관","고글","우주 헬멧"]};
/* 동물·로봇 친구들 (직접 만든 캐릭터) */
function pet(a){
  const k=a.kind,C=AV.shirt[a.shirt],T=[null,["#9b6a45","#f1d9b8"],["#6cc17a","#e3f5cf"],["#b8c4d0","#eef2f6"],["#f08a3c","#fff3e3"]][k],B=T[0],L=T[1],D=shade(B,.8);
  let x=`<ellipse cx="30" cy="81" rx="15" ry="3" fill="#000" opacity=".12"/>`;
  x+=accBack(a.acc);
  if(k===1)x+=`<ellipse cx="45" cy="68" rx="5" ry="12" fill="${D}" transform="rotate(-35 45 68)"/>`;
  if(k===2)x+=`<path d="M38 70 Q58 74 55 56 Q50 66 40 60Z" fill="${D}"/>`;
  if(k===4)x+=`<ellipse cx="46" cy="64" rx="6" ry="12" fill="${D}" transform="rotate(-30 46 64)"/><ellipse cx="50.5" cy="56" rx="4" ry="5" fill="#fff" transform="rotate(-30 50.5 56)"/>`;
  if(k===3)x+=`<rect x="22" y="66" width="6" height="12" rx="2" fill="${D}"/><rect x="32" y="66" width="6" height="12" rx="2" fill="${D}"/><ellipse cx="24.5" cy="79" rx="5.5" ry="3" fill="#5f6b7a"/><ellipse cx="35.5" cy="79" rx="5.5" ry="3" fill="#5f6b7a"/>
    <rect x="10" y="46" width="6" height="17" rx="3" fill="${D}"/><rect x="44" y="46" width="6" height="17" rx="3" fill="${D}"/><rect x="17" y="43" width="26" height="27" rx="6" fill="${B}"/><rect x="21" y="48" width="18" height="14" rx="3" fill="${L}"/><circle cx="30" cy="55" r="4" fill="${C}"/>`;
  else x+=`<ellipse cx="24" cy="78" rx="6" ry="3.5" fill="${D}"/><ellipse cx="36" cy="78" rx="6" ry="3.5" fill="${D}"/><ellipse cx="15" cy="56" rx="4" ry="8" fill="${D}"/><ellipse cx="45" cy="56" rx="4" ry="8" fill="${D}"/>
    <ellipse cx="30" cy="59" rx="14" ry="16" fill="${B}"/><ellipse cx="30" cy="61" rx="9" ry="11" fill="${L}"/><rect x="19" y="40" width="22" height="6" rx="3" fill="${C}"/><rect x="33" y="43" width="5" height="10" rx="2" fill="${C}"/>`;
  if(k===1)x+=`<circle cx="18" cy="13" r="5" fill="${D}"/><circle cx="42" cy="13" r="5" fill="${D}"/>`;
  if(k===2)x+=`<path d="M21 13 l3 -9 l3 6 l3 -8 l3 8 l3 -6 l3 9Z" fill="#f2a33c"/>`;
  if(k===4)x+=`<path d="M16 17 L18 1 L28 11Z" fill="${B}"/><path d="M44 17 L42 1 L32 11Z" fill="${B}"/><path d="M18.500 13 L19.500 5 L24 10Z" fill="${L}"/><path d="M41.500 13 L40.500 5 L36 10Z" fill="${L}"/>`;
  if(k===3)x+=`<path d="M30 10 V3" stroke="#5f6b7a" stroke-width="2"/><circle cx="30" cy="3" r="2.6" fill="${C}"/><rect x="14" y="9" width="32" height="31" rx="8" fill="${B}"/><rect x="18" y="19" width="24" height="14" rx="6" fill="${L}"/>
    <circle cx="24" cy="27" r="3" fill="#29c5f6"/><circle cx="36" cy="27" r="3" fill="#29c5f6"/><rect x="25" y="35" width="10" height="2.400" rx="1.200" fill="#5f6b7a"/>`;
  else{x+=`<circle cx="30" cy="25" r="15" fill="${B}"/>`;
    if(k===1)x+=`<ellipse cx="30" cy="33" rx="7.500" ry="5" fill="${L}"/><path d="M21 32 h-6 M21 34.500 h-5 M39 32 h6 M39 34.500 h5" stroke="${D}" stroke-width=".9" stroke-linecap="round"/>`;
    if(k===2)x+=`<ellipse cx="30" cy="33" rx="9" ry="5" fill="${L}"/>`;
    if(k===4)x+=`<ellipse cx="30" cy="33.500" rx="10" ry="6" fill="#fff"/>`;
    x+=`<circle cx="24" cy="27" r="2.300" fill="#3b2f2a"/><circle cx="36" cy="27" r="2.300" fill="#3b2f2a"/><circle cx="24.800" cy="26.200" r=".8" fill="#fff"/><circle cx="36.800" cy="26.200" r=".8" fill="#fff"/>`;
    x+=k===2?`<circle cx="27.500" cy="31.500" r=".9" fill="#3b2f2a"/><circle cx="32.500" cy="31.500" r=".9" fill="#3b2f2a"/>`:`<ellipse cx="30" cy="31" rx="2.400" ry="1.700" fill="#3b2f2a"/>`;
    x+=`<path d="M27 34 Q30 37 33 34" stroke="#3b2f2a" stroke-width="1.300" fill="none" stroke-linecap="round"/>`;}
  return x+accFront(a.acc);
}
function accBack(c){return c===3?`<path d="M18 44 L9 71 L51 71 L42 44Z" fill="#e8504f"/>`:"";}

  if(t===3){const d=pick([4,5,6,8]),a=rnd(1,d-2),b=rnd(1,d-1-a),v=a+b;return {q:`${fr(a,d)} + ${fr(b,d)} = ?`,o:[fr(v,d),fr(v+1,d),fr(v,d*2)],a:0,x:`분모는 그대로, 분자만 더해. ${a} + ${b} = ${v}`};}

const DIRS={U:[0,-1,"⬆️"],D:[0,1,"⬇️"],L:[-1,0,"⬅️"],R:[1,0,"➡️"]};

  return null;}
function fGrid(){const L=lv("f"),lo=L<2?3:L<4?4:5,hi=L<2?5:L<4?7:9;for(;;){const W={},nw=L<2?rnd(2,4):L<4?rnd(4,6):rnd(5,8);while(Object.keys(W).length<nw)W[rnd(0,4)+","+rnd(0,4)]=1;

function fBoard(L,me,trail){let s="";for(let y=0;y<5;y++)for(let x=0;x<5;x++){const k=x+","+y,isMe=me[0]===x&&me[1]===y,isG=L.G[0]===x&&L.G[1]===y;

function hRoom(){
  const hr=new Date().getHours(),night=hr<6||hr>=19;
  let it="";
  Object.keys(DECOR).forEach(k=>{if(M.decor[k]){const d=DECOR[k];it+=`<button class="ri dc" style="left:${d[3][0]}%;top:${d[3][1]}%" data-d="${k}" aria-label="${d[1]}"><span>${d[0]}</span></button>`;}});
  Object.keys(FURN).forEach(k=>{const f=FURN[k];it+=`<button class="ri" style="left:${f[2][0]}%;top:${f[2][1]}%" data-f="${k}"><span>${f[0]}</span><small>${f[1]}${k==="mail"&&unread()?" 🔴"+unread():""}</small></button>`;});
  box.innerHTML=`<div class="room${night?" night":""}"><div class="rwin">${night?"🌙":"☀️"}</div><div class="rug"></div>${it}<svg class="me" viewBox="0 0 60 84" aria-hidden="true">${avatar(M.av)}</svg></div><div id="hp" class="hp-panel"></div>`;
  box.querySelectorAll(".ri[data-f]").forEach(b=>b.onclick=()=>{SFX("pop");hPanel(b.dataset.f);});
  box.querySelectorAll(".ri[data-d]").forEach(b=>b.onclick=()=>{SFX("tick");const d=DECOR[b.dataset.d];g("hp").innerHTML=`<div class="item"><b>${d[0]} ${d[1]}</b>${d[4]}</div>`;});
  hPanel(night?"bed":"");
  g("pinfo").textContent="방 안의 물건을 눌러 봐요. 별로 방을 꾸밀 수도 있어요.";
}
function hPanel(k){

  if(k==="closet"){editAvatar();return;}
  if(k==="mail"||k==="sent"){
    P.innerHTML=(k==="sent"?`<div class="result"><b>편지를 넣었어요 ✉️</b><br>은준이가 마을 첫 화면에서 새 편지 알림을 보게 돼요.</div>`:"")+`<div class="item"><b>📬 우편함</b>${M.mail.length?"엄마 아빠가 보낸 편지야.":"아직 편지가 없어."}</div>`+M.mail.slice().reverse().map(m=>`<div class="item letter"><b>💌 ${esc(m.d)}${m.read?"":" · 새 편지!"}</b>${esc(m.t)}</div>`).join("")+`<button class="holdbtn" id="mw"><span>✉️ 보호자: 2초 꾹 눌러 편지 쓰기</span></button>`;

function hShop(note){
  box.innerHTML=`<div class="pt"><div class="face">🛋️</div><div class="bubble">모은 별로 방을 꾸며 봐! 산 물건은 방에 놓이고, 누르면 재미있는 이야기를 들려줘.<br><b>쓸 수 있는 별 ⭐ ${bal()}</b></div></div>
    <div class="shopgrid" style="margin-top:12px">${Object.keys(DECOR).map(k=>{const d=DECOR[k],own=M.decor[k];return `<button class="sitem${!own&&bal()<d[2]?" poor":""}" data-d="${k}" ${own?"disabled":""}><div class="e">${d[0]}</div><div class="n">${d[1]}</div>${own?`<div class="own">✅ 방에 있어요</div>`:`<div class="p">⭐ ${d[2]}</div>`}</button>`;}).join("")}</div><div class="msg" id="msg">${note||""}</div>`;
  box.querySelectorAll(".sitem[data-d]:not([disabled])").forEach(b=>b.onclick=()=>{const k=b.dataset.d,d=DECOR[k];
    if(bal()<d[2]){SFX("no");g("msg").textContent="별이 "+(d[2]-bal())+"개 모자라. 문제를 풀어서 모아 보자!";return;}
    M.spent=(M.spent||0)+d[2];M.decor[k]=1;save();SFX("stamp");hShop(d[1]+jo(d[1],"을","를").slice(d[1].length)+" 샀어! 내 방에 가 보자.");drawProg();});
  g("pinfo").textContent="별을 써도 단계와 등급은 내려가지 않아요.";
}

function actTick(){if(document.hidden)return;const dn=day();if(!M.act||M.act.d!==dn)M.act={d:dn,sec:0,nb:1200,hr:false};M.act.sec+=15;const de=M.days[dn]=M.days[dn]||{s:0,q:0};de.sec=M.act.sec;
  const busy=g("ov").classList.contains("on");
  if(!busy&&M.act.sec>=M.act.nb){M.act.nb+=1200;brk();}
  else if(!busy&&M.act.sec>=3600&&!M.act.hr){M.act.hr=true;hourMsg();}
  save();}

 {tp:2,t:"문어 피는 무슨 색일까?",s:[["🐙","문어는 신기한 점이 아주 많아."],["❤️","문어는 심장이 3개야! 아가미로 피를 보내는 심장 2개, 온몸으로 보내는 심장 1개."],["💙","그리고 문어 피는 파란색이야. 피 속에 구리가 들어 있어서 그래."]],q:["문어의 피는 무슨 색일까?",["파란색","빨간색","초록색"],0,"피 속 산소를 나르는 물질에 구리가 있어서 파랗게 보여."]},
 {tp:2,t:"펭귄은 새인데 왜 날지 못할까?",s:[["🐧","펭귄도 새야. 알을 낳고 깃털과 부리가 있어."],["🌊","펭귄 날개는 물속에서 노를 젓는 지느러미처럼 바뀌었어. 하늘 대신 바닷속을 날아!"],["⬇️","황제펭귄은 500m보다 깊이 잠수할 수 있어."]],q:["펭귄의 날개는 무엇을 하는 데 쓰일까?",["물속에서 헤엄치기","하늘 날기","땅 파기"],0,"펭귄은 날개로 물속을 날듯이 헤엄쳐."]},
 {tp:2,t:"치타는 얼마나 오래 달릴 수 있을까?",s:[["🐆","치타는 땅 위에서 가장 빠른 동물이야. 시속 100km쯤 달려."],["😮‍💨","하지만 그렇게 빨리는 몇백 m밖에 못 달려. 몸이 금방 뜨거워지고 지치거든."],["🏃","사람은 빠르진 않지만 오래 달리기는 동물들 중에서도 아주 잘해. 마라톤이 그 증거야!"]],q:["치타가 달리는 방법은?",["아주 빠르게, 짧게만","느리게, 하루 종일","빠르게, 하루 종일"],0,"치타는 짧은 거리 선수, 사람은 긴 거리 선수야."]},
 {tp:2,t:"개미는 얼마나 힘이 셀까?",s:[["🐜","개미는 아주 작지만 힘은 대단해."],["🏋️","개미는 자기 몸무게의 수십 배나 되는 것을 들 수 있어."],["🤔","사람이 그렇게 하려면 자동차를 번쩍 드는 것과 같아. 몸이 작을수록 자기 몸에 비해 힘이 세 보여."]],q:["개미는 자기 몸무게의 몇 배쯤을 들 수 있을까?",["수십 배","절반","딱 1배"],0,"개미는 자기 몸무게의 수십 배를 들고 옮길 수 있어."]},
 {tp:2,t:"박쥐는 깜깜한 밤에 어떻게 볼까?",s:[["🦇","박쥐는 깜깜한 밤에 날아다니며 벌레를 잡아."],["🔊","박쥐는 사람에게 들리지 않는 높은 소리를 내고, 그 소리가 물체에 부딪혀 돌아오는 메아리를 들어."],["🗺️","메아리가 돌아오는 시간으로 벌레가 어디 있는지 알아내. 소리로 보는 거야!"]],q:["박쥐가 어둠 속에서 벌레를 찾는 방법은?",["소리를 내고 메아리를 듣는다","손전등을 켠다","냄새로만 찾는다"],0,"이걸 '반향정위'라고 해. 잠수함도 비슷한 방법을 써."]},
 {tp:2,t:"고양이는 왜 발부터 떨어질까?",s:[["🐱","고양이는 떨어질 때 몸을 빙글 돌려 발부터 땅에 닿아."],["🌀","몸이 아주 유연하고 귀 속 균형 감각이 뛰어나서 떨어지는 동안 몸을 바로잡아."],["⚠️","그래도 높은 곳에서 떨어지면 다칠 수 있으니 조심해야 해."]],q:["고양이가 떨어질 때 쓰는 능력은?",["몸을 돌려 발부터 내린다","날개로 난다","꼬리로 붙잡는다"],0,"균형 감각과 유연한 몸으로 공중에서 몸을 뒤집어."]},
 {tp:2,t:"코끼리는 코로 물을 어떻게 마실까?",s:[["🐘","코끼리 코에는 근육이 수만 개나 있어. 사람 몸 전체 근육보다 훨씬 많아!"],["💧","코끼리는 코로 물을 빨아들인 다음 입에 쏴서 마셔."],["🚿","더운 날에는 코로 물을 뿌려서 샤워도 해."]],q:["코끼리는 물을 어떻게 마실까?",["코로 빨아들여 입에 뿌린다","코로 바로 삼킨다","귀로 마신다"],0,"코는 빨대이자 물총이야. 마시는 건 입으로!"]},
 {tp:3,t:"바퀴는 언제 생겼을까?",s:[["🛞","바퀴는 사람이 만든 가장 중요한 발명 중 하나야."],["🏺","약 5천 년도 더 전에 사람들이 바퀴를 만들어 수레를 굴리기 시작했어."],["🚲","바퀴 덕분에 자전거, 자동차, 기차가 생겼어. 지금도 비행기는 바퀴로 땅에 내려앉아."]],q:["바퀴가 처음 생긴 때는?",["5천 년도 더 전","100년 전","10년 전"],0,"바퀴는 아주아주 오래된 발명품이야."]},
 {tp:3,t:"처음 자전거는 어떻게 생겼을까?",s:[["🚲","약 200년 전 독일에서 처음 자전거 비슷한 것이 생겼어."],["🦶","그런데 페달이 없었어! 안장에 앉아 두 발로 땅을 차면서 달렸어."],["⚙️","페달은 그 뒤에 붙었어. 요즘 어린이들이 타는 밸런스 바이크가 바로 처음 자전거와 닮았어."]],q:["처음 자전거에는 무엇이 없었을까?",["페달","바퀴","손잡이"],0,"두 발로 땅을 차서 가는 자전거였어. 균형 잡는 연습에 딱이야!"]},
 {tp:3,t:"전구는 어떻게 발명됐을까?",s:[["💡","밤에도 환하게 해 주는 전구!"],["🔬","에디슨과 여러 발명가들은 오래 켜지는 전구를 만들려고 수많은 재료로 실험했어. 잘 안 된 실험이 아주 많았지."],["🔁","실패할 때마다 '이 방법은 안 되는구나'를 배워서 결국 오래 가는 전구를 만들었어."]],q:["발명가에게 실패는 어떤 의미일까?",["더 좋은 방법을 찾는 과정","그만두라는 뜻","창피한 일"],0,"안 되는 방법을 하나 알게 될 때마다 정답에 한 걸음 가까워져."]},
 {tp:3,t:"첫 비행기는 얼마나 날았을까?",s:[["✈️","1903년, 라이트 형제가 엔진 달린 비행기로 처음 하늘을 날았어."],["⏱️","첫 비행은 약 12초! 거리는 약 37m로 교실 몇 개 길이쯤이야."],["🌍","그런데 지금은 비행기로 하루 만에 지구 반대편까지 가. 겨우 120년 남짓 만에!"]],q:["라이트 형제의 첫 비행 시간은?",["약 12초","약 12시간","약 12일"],0,"짧았지만 사람이 처음 엔진으로 하늘을 난 역사적인 12초였어."]},
 {tp:3,t:"점자는 누가 만들었을까?",s:[["⠿","점자는 손가락으로 만져서 읽는 글자야."],["👦","프랑스의 루이 브라유가 열다섯 살쯤에 지금의 점자를 만들었어. 그도 앞을 보지 못했어."],["6️⃣","점 6개를 볼록하게 찍는 자리를 바꿔 가며 글자와 숫자를 나타내."]],q:["점자 한 칸은 점 몇 개로 이루어질까?",["6개","2개","20개"],0,"점 6개의 조합으로 64가지 모양을 만들 수 있어. 2 × 2 × 2 × 2 × 2 × 2 = 64!"]},
 {tp:3,t:"처음 컴퓨터는 얼마나 컸을까?",s:[["💻","요즘 컴퓨터는 가방에 쏙 들어가."],["🏢","약 80년 전 처음 만든 전자 컴퓨터는 커다란 방 하나를 가득 채웠어. 무게는 코끼리 몇 마리만큼!"],["📱","지금 우리 손 안의 스마트폰은 그 컴퓨터보다 훨씬훨씬 빨라."]],q:["처음 만든 전자 컴퓨터의 크기는?",["커다란 방 하나를 채웠다","손바닥만 했다","공책만 했다"],0,"부품이 커서 방 하나가 컴퓨터였어. 기술이 발전하면서 점점 작아졌어."]},
 {tp:3,t:"냉장고가 없던 옛날에는 얼음을 어떻게 보관했을까?",s:[["🧊","옛날에는 겨울에 강에서 얼음을 잘라 왔어."],["🏚️","우리 조상들은 '석빙고'라는 돌로 만든 얼음 창고에 얼음을 넣어 두었어. 반쯤 땅에 묻혀 있어서 시원했어."],["☀️","그래서 여름에도 얼음을 꺼내 쓸 수 있었어. 경주에 가면 지금도 석빙고를 볼 수 있어."]],q:["옛날 우리나라에서 얼음을 보관한 곳은?",["석빙고","피라미드","등대"],0,"석빙고는 바람길과 흙덮개로 안을 시원하게 지킨 과학적인 창고야."]},
 {tp:3,t:"스마트폰 안에는 무엇이 들어 있을까?",s:[["📱","스마트폰은 작은 컴퓨터야."],["🧭","그 안에는 카메라, 마이크, 스피커, 그리고 기울기를 느끼는 센서와 내 위치를 아는 장치까지 들어 있어."],["🚀","옛날에 사람을 달에 보낸 컴퓨터보다 지금 스마트폰이 훨씬 계산을 빨리 해."]],q:["스마트폰을 돌리면 화면이 따라 도는 까닭은?",["기울기를 느끼는 센서가 있어서","화면이 무거워서","바람이 불어서"],0,"작은 센서가 기울기를 느껴서 화면 방향을 바꿔 줘."]},
 {tp:4,t:"한글은 어떻게 만들었을까?",s:[["📜","세종대왕은 백성들이 쉽게 글을 배울 수 있도록 한글(훈민정음)을 만들었어."],["👄","자음은 소리 낼 때 입과 혀, 목구멍의 모양을 본떠 만들었어. 'ㄱ'은 혀뿌리가 목구멍을 막는 모양이야."],["🌏","모음은 하늘(ㆍ), 땅(ㅡ), 사람(ㅣ)을 본떠 만들었어. 세상에서 가장 과학적인 글자 중 하나로 꼽혀."]],q:["'ㄱ'은 무엇의 모양을 본떠 만들었을까?",["혀뿌리가 목구멍을 막는 모양","나무","집 지붕"],0,"자음은 소리를 낼 때 발음 기관의 모양을 본떴어."]},
 {tp:4,t:"피라미드는 돌이 몇 개일까?",s:[["🔺","이집트의 가장 큰 피라미드는 약 4500년 전에 지어졌어."],["🧱","돌 덩어리가 약 230만 개나 들어갔어! 돌 하나가 자동차 한 대보다 무거운 것도 많아."],["🤔","크레인도 없던 때에 어떻게 옮겼을까? 경사로를 만들고 많은 사람이 힘을 합쳤다고 생각해."]],q:["가장 큰 피라미드에 쓰인 돌은 약 몇 개일까?",["약 230만 개","약 230개","약 2만 개"],0,"230만 개! 하루에 수백 개씩 쌓아도 몇 년이 걸려."]},
 {tp:4,t:"거북선은 왜 지붕을 덮었을까?",s:[["🐢","거북선은 이순신 장군이 왜적과 싸울 때 쓴 배야."],["🛡️","배 위를 지붕으로 덮고 뾰족한 쇠못을 박아서 적이 배 위로 뛰어오르지 못하게 했어."],["🔥","앞쪽 용머리에서는 대포를 쏘거나 연기를 뿜었다고 해."]],q:["거북선이 지붕에 뾰족한 못을 박은 까닭은?",["적이 배 위로 올라오지 못하게","예쁘게 꾸미려고","비를 막으려고"],0,"적이 배에 올라와 싸우는 방법을 막는 똑똑한 생각이었어."]},
 {tp:4,t:"측우기는 무엇을 쟀을까?",s:[["🌧️","농사를 지으려면 비가 얼마나 왔는지 아는 게 중요해."],["📏","세종대왕 때 '측우기'를 만들어 나라 곳곳에서 빗물의 양을 쟀어."],["📊","비 온 양을 기록해 두면 다음 해 농사를 계획하는 데 쓸 수 있어. 날씨를 데이터로 모은 거야!"]],q:["측우기로 잰 것은?",["비가 온 양","바람의 세기","기온"],0,"원통에 고인 빗물의 깊이를 재서 비의 양을 기록했어."]},
 {tp:4,t:"사람과 공룡은 함께 살았을까?",s:[["🦖","티라노사우루스 같은 공룡은 약 6600만 년 전에 사라졌어."],["🧑","사람은 그보다 훨씬 훨씬 나중에 나타났어. 사람과 공룡은 만난 적이 없어!"],["🐦","그런데 놀라운 사실! 과학자들은 새가 공룡의 후손이라고 생각해."]],q:["사람과 티라노사우루스는 함께 살았을까?",["아니, 만난 적이 없다","응, 함께 살았다","가끔 만났다"],0,"만화에서는 같이 나오지만 실제로는 수천만 년이나 떨어져 있어."]},
 {tp:4,t:"만리장성은 우주에서 보일까?",s:[["🧱","만리장성은 아주아주 긴 성벽이야."],["🛰️","그런데 '우주에서 맨눈으로 보이는 유일한 건물'이라는 말은 사실이 아니야."],["🔍","길긴 해도 폭이 좁아서 우주에서는 맨눈으로 찾기 아주 어려워. 우주 비행사들도 그렇게 말했어."]],q:["만리장성은 우주에서 맨눈으로 잘 보일까?",["잘 보이지 않는다","아주 잘 보인다","밤에만 잘 보인다"],0,"유명한 말이라도 사실인지 확인해 보는 습관이 중요해!"]},
 {tp:4,t:"마라톤은 왜 42.195km일까?",s:[["🏃","마라톤은 아주 먼 거리를 달리는 경기야."],["📜","옛날 그리스 병사가 승리 소식을 전하려고 먼 길을 달렸다는 이야기에서 이름이 생겼어."],["👑","지금의 42.195km는 런던 올림픽 때 출발점과 왕실 관람석까지의 거리에 맞추면서 정해졌어."]],q:["마라톤의 거리는?",["42.195km","10km","100km"],0,"42.195km! 이후로 이 거리가 마라톤의 공식 거리가 됐어."]},
 {tp:4,t:"돈이 없던 옛날에는 어떻게 물건을 샀을까?",s:[["🐟","아주 옛날에는 물건끼리 바꿨어. 생선과 쌀을 바꾸는 식이었지."],["🐚","그러다 조개껍데기나 쇠붙이처럼 모두가 귀하게 여기는 것을 돈처럼 썼어."],["💳","그 뒤 동전과 지폐가 생겼고, 지금은 카드와 스마트폰으로 계산해."]],q:["돈이 없을 때 사람들은 어떻게 했을까?",["물건과 물건을 바꿨다","아무것도 사지 않았다","모든 걸 공짜로 받았다"],0,"이걸 '물물교환'이라고 해. 원하는 물건을 가진 사람을 찾기가 어려워서 돈이 생겼어."]},
 {tp:5,t:"겨울에 문고리를 잡으면 왜 찌릿할까?",s:[["⚡","겨울에 문고리를 잡다가 찌릿! 놀란 적 있지?"],["🧥","옷이 서로 비벼지면 몸에 전기가 조금씩 모여. 이걸 '정전기'라고 해."],["🚪","쇠로 된 문고리에 닿는 순간 모인 전기가 한꺼번에 빠져나가서 찌릿한 거야. 공기가 건조할수록 더 잘 생겨."]],q:["정전기가 덜 생기는 날은?",["공기가 촉촉한 날","아주 건조한 날","바람 부는 겨울날"],0,"공기에 물기가 많으면 전기가 조금씩 빠져나가서 덜 모여."]},
 {tp:5,t:"양파를 썰면 왜 눈물이 날까?",s:[["🧅","양파를 썰면 눈이 따갑고 눈물이 나."],["💨","양파가 잘리면 눈을 따갑게 하는 기체가 나와서 눈으로 날아가."],["❄️","양파를 냉장고에 넣어 차갑게 한 뒤 썰면 기체가 덜 날아와서 덜 매워."]],q:["양파를 썰 때 눈물을 줄이는 방법은?",["양파를 차갑게 해서 썬다","크게 소리를 지른다","눈을 크게 뜬다"],0,"차가우면 기체가 덜 날아올라."]},
 {tp:5,t:"팝콘은 왜 펑 하고 튈까?",s:[["🌽","팝콘은 특별한 옥수수 알로 만들어."],["💧","옥수수 알 속에는 물이 조금 들어 있어. 뜨겁게 데우면 이 물이 수증기로 바뀌면서 부풀어."],["💥","단단한 껍질이 더 못 버티는 순간 펑! 속살이 하얗게 뒤집혀 나와."]],q:["팝콘이 튀는 까닭은?",["알 속 물이 수증기로 변해 껍질을 터뜨려서","소금 때문에","기름이 폭발해서"],0,"물이 수증기가 되면 부피가 아주 커져서 껍질을 터뜨려."]},
 {tp:5,t:"얼음은 왜 물에 뜰까?",s:[["🧊","대부분의 물질은 얼면 더 작고 무거워져. 그런데 물은 반대야!"],["📈","물은 얼면서 부피가 커지고 같은 크기로 보면 더 가벼워져. 그래서 얼음은 물에 떠."],["🐟","덕분에 겨울에 호수는 위만 얼고 아래는 물로 남아서 물고기가 살 수 있어."]],q:["물을 가득 채운 페트병을 얼리면?",["부풀어 오른다","줄어든다","그대로다"],0,"물은 얼면 부피가 커져서 병이 빵빵해져."]},

 {tp:5,t:"운동화 바닥에는 왜 울퉁불퉁 무늬가 있을까?",s:[["👟","운동화 바닥을 보면 울퉁불퉁한 무늬가 있어."],["🧲","무늬가 땅을 꽉 잡아서 미끄러지지 않게 해 줘. 이걸 '마찰'이라고 해."],["⚽","축구화 바닥에 뾰족한 징이 있는 것도 잔디에서 미끄러지지 않으려고야."]],q:["운동화 바닥 무늬가 하는 일은?",["미끄러지지 않게 땅을 잡는다","신발을 가볍게 한다","소리를 낸다"],0,"마찰을 크게 해서 달리고 멈출 때 미끄러지지 않게 해."]},
 {tp:5,t:"구급차 앞 글씨는 왜 거꾸로 쓰여 있을까?",s:[["🚑","구급차 앞을 보면 글씨가 좌우가 바뀌어 써 있어."],["🪞","거울에 비치면 왼쪽과 오른쪽이 바뀌어 보이잖아."],["🚗","앞차 운전자가 뒤를 보는 거울로 볼 때 글씨가 바르게 읽히도록 일부러 거꾸로 쓴 거야. 빨리 길을 비켜 줄 수 있게!"]],q:["구급차 글씨를 거꾸로 쓴 까닭은?",["앞차가 거울로 바르게 읽도록","멋있어 보이려고","잘못 써서"],0,"거울에 비치면 다시 바르게 보여. 생명을 구하는 작은 아이디어야."]}

 {tp:0,t:"배에서 왜 꼬르륵 소리가 날까?",s:[["🍽️","배고플 때 배에서 꼬르륵 소리가 나."],["🌀","위와 장은 음식을 아래로 보내려고 꿈틀꿈틀 움직여. 이때 안에 있는 공기와 물이 밀리면서 소리가 나."],["🔊","배가 비어 있으면 소리를 막아 줄 음식이 없어서 더 크게 울려."]],q:["꼬르륵 소리는 어디에서 날까?",["위와 장이 움직이면서","심장이 뛰면서","뼈가 자라면서"],0,"위와 장이 꿈틀거리며 공기와 물을 밀어서 나는 소리야."]},
 {tp:0,t:"추우면 왜 소름이 돋을까?",s:[["🥶","추울 때 팔에 오돌토돌 소름이 돋아."],["🐈","피부 속 아주 작은 근육이 털을 세우는 거야. 털이 많은 동물은 털을 세워 따뜻한 공기를 가둬."],["🧑","사람은 털이 적어서 크게 따뜻해지진 않아. 먼 옛날의 흔적처럼 남아 있는 거야."]],q:["소름이 돋을 때 몸에서 일어나는 일은?",["작은 근육이 털을 세운다","피부에 물이 고인다","뼈가 움직인다"],0,"고양이가 놀라서 털을 부풀리는 것과 같은 원리야."]},
 {tp:0,t:"손톱은 자를 때 왜 안 아플까?",s:[["✂️","손톱이나 머리카락은 잘라도 하나도 안 아파."],["🧱","손톱은 '케라틴'이라는 단단한 재료로 되어 있고, 끝부분에는 아픔을 느끼는 신경이 없어."],["💇","머리카락도 손톱과 같은 재료야. 그래서 자를 때 안 아파."]],q:["손톱과 같은 재료로 된 것은?",["머리카락","뼈","이"],0,"손톱과 머리카락은 둘 다 케라틴으로 되어 있어."]},
 {tp:0,t:"코를 막고 먹으면 왜 맛이 이상할까?",s:[["👅","혀는 단맛, 짠맛, 신맛, 쓴맛, 감칠맛을 느껴."],["👃","그런데 딸기 맛, 바나나 맛 같은 풍부한 맛은 코로 맡는 냄새가 함께 만들어."],["🤧","그래서 감기로 코가 막히면 음식 맛이 밍밍하게 느껴져."]],q:["코를 막고 사과를 먹으면?",["맛이 덜 느껴진다","더 달게 느껴진다","똑같다"],0,"맛의 많은 부분은 사실 냄새야. 코를 막고 사과와 배를 맞혀 보는 실험을 해 봐!"]},
 {tp:0,t:"피는 왜 빨갈까?",s:[["🩸","다쳤을 때 나오는 피는 빨간색이야."],["🔴","피 속 적혈구에는 철이 들어 있는 '헤모글로빈'이 있어. 산소를 실어 나르면서 빨갛게 보여."],["💙","손목 혈관이 파랗게 보이는 건 피부를 지나오는 빛 때문이야. 몸속 피는 언제나 빨간색이야."]],q:["손목 혈관 속 피는 무슨 색일까?",["빨간색","파란색","초록색"],0,"혈관이 파래 보여도 그 안의 피는 빨간색이야."]},
 {tp:0,t:"재채기는 왜 할까?",s:[["🤧","에취! 재채기는 갑자기 나와."],["🌼","코 안에 먼지나 꽃가루, 병균이 들어오면 몸이 힘껏 밖으로 내보내려고 재채기를 해."],["💪","재채기 속 침방울은 멀리 날아가. 그래서 팔꿈치 안쪽으로 가리는 게 예절이야."]],q:["재채기할 때 좋은 방법은?",["팔꿈치 안쪽으로 가린다","친구 쪽으로 한다","가리지 않는다"],0,"손바닥보다 팔꿈치로 가리면 손에 병균이 덜 묻어."]},
 {tp:0,t:"우리 몸에서 가장 큰 근육은?",s:[["🍑","우리 몸에서 가장 큰 근육은 엉덩이에 있어!"],["🏃","엉덩이 근육은 달리기, 점프, 계단 오르기를 할 때 몸을 앞으로, 위로 밀어 줘."],["🦵","스쿼트나 줄넘기를 하면 엉덩이 근육이 튼튼해져서 더 높이 뛸 수 있어."]],q:["점프할 때 큰 힘을 내는 가장 큰 근육은 어디에 있을까?",["엉덩이","손가락","눈꺼풀"],0,"엉덩이 근육이 튼튼하면 더 빨리 달리고 더 높이 뛸 수 있어."]},
 {tp:0,t:"빙글빙글 돌면 왜 어지러울까?",s:[["🌀","제자리에서 빙글빙글 돌다 멈추면 세상이 계속 도는 것 같아."],["👂","귀 속 깊은 곳에 균형을 느끼는 관이 있어. 그 안의 물이 돌다가 멈춰도 한동안 계속 출렁거려."],["⛸️","피겨 선수나 무용수는 돌 때마다 한 곳을 콕 바라보는 연습을 해서 덜 어지러워."]],q:["균형을 느끼는 곳은 어디에 있을까?",["귀 속","코 속","손톱 밑"],0,"귀는 소리뿐 아니라 균형도 담당해."]},
 {tp:0,t:"뇌는 얼마나 많은 에너지를 쓸까?",s:[["🧠","뇌의 무게는 몸무게의 50분의 1쯤밖에 안 돼."],["⚡","그런데 뇌는 몸 전체 에너지의 5분의 1쯤을 써! 생각하는 데 에너지가 많이 들거든."],["🍚","그래서 아침밥을 먹어야 공부할 때 머리가 잘 돌아가."]],q:["뇌가 쓰는 에너지는 몸 전체의 약 얼마일까?",["5분의 1쯤","100분의 1쯤","전부"],0,"작은 뇌가 큰 에너지를 써. 생각은 힘든 일이야!"]},
 {tp:0,t:"어린이는 왜 이가 빠질까?",s:[["🦷","어린이의 첫 이를 '젖니'라고 해. 모두 20개야."],["⬆️","6살쯤부터 젖니 아래에서 더 크고 튼튼한 '영구치'가 올라오면서 젖니를 밀어내."],["😁","영구치는 평생 쓰는 이라서 다시 나지 않아. 그래서 양치질이 정말 중요해!"]],q:["젖니는 모두 몇 개일까?",["20개","32개","10개"],0,"젖니 20개가 빠지고 영구치가 나. 어른 이는 사랑니까지 32개야."]},
 {tp:1,t:"달의 '바다'에는 물이 있을까?",s:[["🌕","달을 보면 어두운 무늬가 있어. 옛날 사람들은 이곳을 '바다'라고 불렀어."],["🌋","사실 이곳은 아주 오래전 용암이 흘러나와 굳은 넓은 평원이야."],["🐇","우리 조상들은 이 무늬를 보고 '방아 찧는 토끼'를 떠올렸어. 너에게는 무엇처럼 보여?"]],q:["달의 '바다'라고 부르는 곳에는?",["물이 없다","물이 가득하다","물고기가 산다"],0,"이름만 바다일 뿐, 굳은 용암으로 된 평원이야."]},
 {tp:1,t:"태양계에서 가장 뜨거운 행성은?",s:[["🔥","해와 가장 가까운 건 수성인데, 가장 뜨거운 행성은 두 번째인 금성이야!"],["🌫️","금성은 아주 두꺼운 구름과 공기가 열을 담요처럼 가둬."],["🌡️","그래서 금성 표면은 400도가 넘어. 납도 녹을 만큼 뜨거워."]],q:["태양계에서 가장 뜨거운 행성은?",["금성","수성","화성"],0,"두꺼운 공기가 열을 가둬서 수성보다 더 뜨거워."]},
 {tp:1,t:"목성의 빨간 점은 무엇일까?",s:[["🪐","목성에는 커다란 빨간 점이 있어."],["🌪️","이건 거대한 폭풍이야! 크기가 지구보다도 커."],["⏳","이 폭풍은 수백 년 동안 계속 불고 있어. 망원경이 생긴 뒤로 계속 관찰되고 있지."]],q:["목성의 빨간 점의 정체는?",["지구보다 큰 폭풍","화산","바다"],0,"지구를 삼킬 만큼 큰 폭풍이 오랫동안 불고 있어."]},
 {tp:1,t:"토성은 물에 뜰 수 있을까?",s:[["🪐","토성은 지구보다 훨씬 큰 행성이야."],["🎈","그런데 토성은 대부분 가벼운 기체로 되어 있어서 같은 크기로 보면 물보다 가벼워."],["🛁","그래서 토성이 들어갈 만큼 커다란 욕조가 있다면 토성은 둥둥 뜰 거야!"]],q:["토성이 물보다 가벼운 까닭은?",["대부분 가벼운 기체로 되어 있어서","속이 텅 비어서","작아서"],0,"크기는 크지만 가벼운 기체로 되어 있어."]},
 {tp:1,t:"해왕성까지 가는 데 얼마나 걸릴까?",s:[["🔵","해왕성은 태양계에서 해와 가장 먼 행성이야."],["🛰️","1977년에 출발한 탐사선 보이저 2호는 해왕성에 닿기까지 12년이 걸렸어."],["🚀","보이저호는 지금도 우주 저 멀리를 날아가고 있어. 사람이 만든 가장 멀리 간 물건 중 하나야."]],q:["보이저 2호가 해왕성까지 간 시간은?",["약 12년","약 12일","약 12시간"],0,"우주는 넓어서 아주 빠른 탐사선도 몇 년씩 걸려."]},
 {tp:1,t:"우주 정거장은 하루에 지구를 몇 바퀴 돌까?",s:[["🛰️","우주 정거장은 약 90분에 지구를 한 바퀴 돌아."],["🔢","하루는 24시간, 1440분이야. 1440 ÷ 90을 하면 16!"],["🌅","그래서 우주 비행사는 하루에 해돋이를 16번쯤 봐."]],q:["우주 정거장은 하루에 지구를 약 몇 바퀴 돌까?",["16바퀴","1바퀴","100바퀴"],0,"90분에 한 바퀴씩, 하루에 약 16바퀴야."]},
 {tp:1,t:"혜성 꼬리는 어느 쪽을 향할까?",s:[["☄️","혜성은 얼음과 먼지로 된 덩어리야. 해에 가까워지면 꼬리가 생겨."],["🌬️","해에서는 아주 작은 알갱이들이 바람처럼 불어 나와."],["➡️","그래서 혜성 꼬리는 날아가는 방향과 상관없이 언제나 해의 반대쪽을 향해."]],q:["혜성 꼬리는 어느 쪽을 향할까?",["해의 반대쪽","언제나 뒤쪽","지구 쪽"],0,"해에서 부는 바람이 꼬리를 밀어내기 때문이야."]},
 {tp:1,t:"작은 달이 어떻게 큰 해를 가릴까?",s:[["🌑","일식은 달이 해를 가려서 낮이 잠깐 어두워지는 현상이야."],["📏","해는 달보다 약 400배 커. 그런데 해는 달보다 약 400배 멀리 있어!"],["👀","그래서 하늘에서 해와 달이 거의 같은 크기로 보이고, 달이 해를 딱 가릴 수 있어."]],q:["달이 해를 가릴 수 있는 까닭은?",["해가 훨씬 멀어서 비슷한 크기로 보여서","달이 해보다 커서","해가 꺼져서"],0,"400배 크지만 400배 멀어서 똑같은 크기로 보이는 신기한 우연이야."]},
 {tp:1,t:"은하수는 무엇일까?",s:[["🌌","아주 깜깜한 시골 밤하늘에는 뿌연 빛의 강, 은하수가 보여."],["✨","은하수는 우리가 사는 은하를 안쪽에서 옆으로 본 모습이야. 별이 수천억 개나 모여 있어."],["🏙️","도시에서는 불빛이 너무 밝아서 은하수가 잘 안 보여."]],q:["은하수의 정체는?",["아주 많은 별이 모인 우리 은하","하늘의 구름","달빛"],0,"우리 은하에는 해 같은 별이 수천억 개 있어."]},
 {tp:1,t:"가장 뜨거운 별은 무슨 색일까?",s:[["⭐","별은 색깔이 조금씩 달라. 빨간 별, 노란 별, 파란 별이 있어."],["🔥","불꽃도 파란 부분이 더 뜨겁지? 별도 파란 별이 가장 뜨겁고, 빨간 별이 덜 뜨거워."],["☀️","우리 해는 그 중간쯤인 노란 별이야."]],q:["가장 뜨거운 별의 색은?",["파란색","빨간색","노란색"],0,"파랄수록 뜨겁고, 붉을수록 덜 뜨거워."]},
 {tp:2,t:"얼룩말 줄무늬는 모두 같을까?",s:[["🦓","얼룩말은 까만 바탕에 흰 줄무늬가 있어."],["🖐️","줄무늬는 얼룩말마다 모두 달라. 사람 지문처럼!"],["🪰","과학자들은 줄무늬가 피를 빠는 파리가 내려앉지 못하게 막아 준다는 연구 결과를 내놓았어."]],q:["얼룩말 줄무늬는?",["얼룩말마다 모두 다르다","모두 똑같다","나이가 들면 사라진다"],0,"줄무늬로 서로를 알아볼 수도 있어."]},
 {tp:2,t:"상어 이빨은 몇 번 날까?",s:[["🦈","상어는 이빨이 여러 줄로 나 있어."],["🔁","이빨이 빠지면 뒷줄 이빨이 앞으로 나와. 평생 이빨이 계속 새로 나!"],["🦴","그리고 상어 몸에는 딱딱한 뼈 대신 말랑한 '연골'이 있어. 우리 귀와 코끝처럼."]],q:["상어 이빨은?",["평생 계속 새로 난다","한 번 빠지면 끝이다","처음부터 없다"],0,"그래서 바닷가에서 상어 이빨 화석이 많이 발견돼."]},
 {tp:2,t:"플라밍고는 왜 분홍색일까?",s:[["🦩","플라밍고는 분홍색 깃털로 유명해."],["🦐","사실 플라밍고는 태어날 때 회색이야. 분홍빛 색소가 든 작은 새우와 물속 생물을 먹으면서 분홍색이 돼."],["🥕","당근을 아주 많이 먹으면 손바닥이 노래지는 것과 비슷해."]],q:["플라밍고가 분홍색이 되는 까닭은?",["먹이 속 색소 때문","햇볕에 타서","물감을 묻혀서"],0,"먹는 것이 몸 색깔을 바꿔."]},
 {tp:2,t:"새끼를 낳는 아빠 동물은?",s:[["🐴","해마는 말처럼 생긴 작은 물고기야."],["👨‍🍼","엄마 해마가 아빠의 배 주머니에 알을 넣으면, 아빠가 알을 품었다가 새끼를 낳아!"],["🌊","한 번에 새끼 수백 마리가 아빠 배에서 나오기도 해."]],q:["해마는 누가 새끼를 낳을까?",["아빠","엄마","할머니"],0,"동물 세계에서도 아주 특별한 경우야."]},
 {tp:2,t:"꿀벌은 어떻게 꽃 위치를 알려 줄까?",s:[["🐝","꿀벌은 꿀이 많은 꽃을 찾으면 집에 돌아가 친구들에게 알려."],["💃","말 대신 엉덩이를 흔들며 8자 모양으로 춤을 춰!"],["🧭","춤의 방향은 꽃이 있는 방향, 흔드는 시간은 거리를 알려 줘. 꿀벌의 지도야."]],q:["꿀벌이 꽃 위치를 알려 주는 방법은?",["춤을 춘다","노래를 부른다","그림을 그린다"],0,"8자 춤으로 방향과 거리를 알려 줘."]},
 {tp:2,t:"카멜레온의 눈은 어떻게 움직일까?",s:[["🦎","카멜레온은 몸 색깔을 바꾸는 걸로 유명해."],["👀","그런데 눈도 신기해. 양쪽 눈을 따로따로 움직여서 앞과 뒤를 한꺼번에 볼 수 있어."],["👅","먹이를 찾으면 몸길이만큼 긴 혀를 순식간에 쏘아서 잡아."]],q:["카멜레온 눈의 특별한 점은?",["두 눈을 따로 움직인다","눈이 4개다","눈을 감지 않는다"],0,"한쪽 눈은 앞을, 한쪽 눈은 뒤를 볼 수 있어."]},
 {tp:2,t:"북극곰의 피부는 무슨 색일까?",s:[["🐻‍❄️","북극곰은 하얀 털로 덮여 있어."],["🔍","그런데 털 하나하나는 사실 투명해! 빛이 반사되어 하얗게 보이는 거야."],["⬛","털 아래 피부는 검은색이야. 검은색은 햇볕의 열을 잘 흡수해서 따뜻해."]],q:["북극곰 털 아래 피부색은?",["검은색","하얀색","분홍색"],0,"검은 피부가 햇볕을 모아 추운 북극에서 몸을 데워."]},
 {tp:2,t:"거북이는 등딱지를 벗을 수 있을까?",s:[["🐢","만화에서는 거북이가 등딱지를 벗기도 하지?"],["🦴","하지만 진짜 거북이의 등딱지는 갈비뼈와 등뼈가 붙어서 만들어진 몸의 일부야."],["🏠","그래서 절대 벗을 수 없어. 평생 함께하는 튼튼한 집이야."]],q:["거북이 등딱지는 무엇일까?",["뼈와 붙어 있는 몸의 일부","갈아입는 옷","주운 껍데기"],0,"등딱지는 뼈와 이어져 있어서 벗을 수 없어."]},
 {tp:2,t:"해달은 잘 때 왜 손을 잡을까?",s:[["🦦","해달은 바다 위에 둥둥 누워서 잠을 자."],["🤝","자는 동안 파도에 떠내려가 서로 멀어지지 않도록 친구와 손을 잡거나, 몸에 해초를 감기도 해."],["🪨","배 위에 돌을 올려놓고 조개를 깨 먹는 똑똑한 동물이기도 해."]],q:["해달이 자면서 손을 잡는 까닭은?",["떠내려가 헤어지지 않으려고","춥지 않으려고","춤추려고"],0,"바다 위에서 자니까 서로 붙잡고 있어야 해."]},
 {tp:2,t:"낙타 혹에는 무엇이 들어 있을까?",s:[["🐫","낙타는 사막을 오래 걸어도 잘 버텨."],["💧","혹에 물이 들어 있다고 많이들 생각하지만, 사실 혹에는 지방이 들어 있어!"],["🍔","먹이가 없을 때 이 지방을 에너지로 써. 낙타는 물도 한 번에 아주 많이 마실 수 있어."]],q:["낙타 혹에 들어 있는 것은?",["지방","물","모래"],0,"혹은 에너지 저장 창고야."]},
 {tp:3,t:"연필심은 무엇으로 만들까?",s:[["✏️","연필심을 영어로 '납(lead)'이라고 부르기도 해."],["🪨","하지만 연필심에는 납이 들어 있지 않아. '흑연'과 점토를 섞어서 구워 만들어."],["🔢","흑연이 많을수록 진하고 부드러워. 그래서 연필에 B, HB 같은 글자가 쓰여 있어."]],q:["연필심의 주재료는?",["흑연","납","플라스틱"],0,"흑연이 종이에 묻어나서 글씨가 써지는 거야."]},
 {tp:3,t:"지우개는 어떻게 글씨를 지울까?",s:[["🧽","지우개로 문지르면 연필 글씨가 사라져."],["🧲","연필 글씨는 흑연 가루가 종이에 붙은 거야. 지우개는 흑연 가루를 자기 쪽으로 붙잡아."],["🌀","그래서 지우개 가루에 까만 흑연이 섞여서 떨어져 나와."]],q:["지우개 가루가 까만 까닭은?",["흑연 가루를 붙잡아 떨어져서","지우개가 타서","원래 까매서"],0,"지우개가 흑연을 붙잡아 함께 떨어져 나가."]},
 {tp:3,t:"갈릴레이는 망원경으로 무엇을 봤을까?",s:[["🔭","약 400년 전 갈릴레이는 망원경을 하늘로 돌린 최초의 사람 중 하나야."],["🌕","그는 달 표면이 울퉁불퉁하다는 걸 봤고, 목성 둘레를 도는 위성 4개를 발견했어."],["🌍","이 발견은 '모든 것이 지구를 돈다'는 옛날 생각을 바꾸는 데 큰 도움이 됐어."]],q:["갈릴레이가 목성에서 발견한 것은?",["목성을 도는 위성 4개","목성의 고리","목성의 바다"],0,"망원경이라는 발명품이 우주를 보는 눈을 바꿨어."]},
 {tp:3,t:"냉장고는 어떻게 차가워질까?",s:[["🧊","냉장고는 불 대신 무엇으로 시원해질까?"],["💨","냉장고 안에는 특별한 액체가 관을 따라 돌아. 이 액체가 기체로 바뀔 때 주변의 열을 빼앗아 가."],["🫧","땀이 마르면서 몸이 시원해지는 것과 같은 원리야. 빼앗은 열은 냉장고 뒤쪽으로 내보내."]],q:["냉장고가 차가워지는 원리와 비슷한 것은?",["땀이 마르며 몸이 시원해지는 것","불을 피우는 것","얼음을 녹이는 것"],0,"액체가 기체로 바뀔 때 열을 가져가는 원리야."]},
 {tp:3,t:"지퍼는 어떻게 잠길까?",s:[["🧥","지퍼를 올리면 양쪽이 착 붙어."],["🦷","지퍼 양쪽에는 작은 이가 줄지어 있어. 손잡이가 지나가면서 이들을 서로 엇갈리게 끼워 줘."],["🔓","반대로 내리면 손잡이 속 쐐기가 이를 하나씩 떼어 내."]],q:["지퍼가 잠기는 원리는?",["작은 이들이 서로 맞물린다","자석이 붙는다","풀이 붙는다"],0,"작은 이 수백 개가 차례로 맞물려서 단단하게 잠겨."]},
 {tp:3,t:"다른 나라와 인터넷은 어떻게 연결될까?",s:[["🌐","우리는 인터넷으로 다른 나라 영상도 바로 봐."],["🌊","나라와 나라, 대륙과 대륙 사이는 대부분 바닷속에 깔린 아주 긴 케이블로 연결되어 있어."],["💡","케이블 속에서는 빛으로 정보를 보내. 그래서 지구 반대편까지 눈 깜짝할 새 도착해."]],q:["대륙 사이 인터넷은 주로 무엇으로 연결될까?",["바닷속 케이블","하늘을 나는 새","무지개"],0,"인공위성도 쓰지만, 대부분은 바닷속 케이블로 연결돼."]},
 {tp:3,t:"신호등의 '멈춤'은 왜 빨간색일까?",s:[["🚦","신호등은 빨강, 노랑, 초록 불로 약속을 정해."],["🔴","빨간빛은 공기 속에서 덜 흩어져서 멀리서도 잘 보여."],["🛑","그래서 가장 중요한 '멈춤' 신호에 빨간색을 써. 멈춤 표지판이 빨간 것도 같은 까닭이야."]],q:["'멈춤'에 빨간색을 쓰는 까닭은?",["멀리서도 잘 보여서","가장 예뻐서","가장 싸서"],0,"빨간빛은 멀리까지 잘 전달돼."]},
 {tp:3,t:"가장 오래된 금속활자 책은?",s:[["📕","옛날에는 책을 손으로 하나하나 베껴 썼어."],["🔤","글자를 금속으로 만들어 조립해서 찍는 '금속활자'를 쓰면 책을 여러 권 빨리 만들 수 있어."],["🇰🇷","지금 남아 있는 가장 오래된 금속활자 책은 고려 시대에 찍은 '직지'야."]],q:["지금 남아 있는 가장 오래된 금속활자 책은?",["직지","해리 포터","백과사전"],0,"고려 사람들의 놀라운 발명 실력이야."]},
 {tp:3,t:"안전띠는 왜 꼭 매야 할까?",s:[["🚗","달리던 자동차가 갑자기 멈추면 몸은 계속 앞으로 가려고 해."],["🏃","이걸 '관성'이라고 해. 버스가 멈출 때 몸이 앞으로 쏠리는 것과 같아."],["🛡️","안전띠는 몸이 앞으로 튀어 나가지 않게 꽉 붙잡아 줘. 그래서 짧은 거리도 꼭 매야 해."]],q:["안전띠가 막아 주는 것은?",["몸이 앞으로 튀어 나가는 것","자동차가 느려지는 것","라디오 소리"],0,"관성 때문에 몸이 앞으로 쏠리는 걸 붙잡아 줘."]},
 {tp:3,t:"무거운 비행기는 어떻게 날까?",s:[["✈️","비행기는 버스 수십 대만큼 무거운데도 하늘을 날아."],["🪽","날개는 앞쪽이 살짝 들려 있는 특별한 모양이야. 빠르게 달리면 날개가 공기를 아래로 밀어 내."],["⬆️","공기를 아래로 밀면 비행기는 위로 떠올라. 이 힘을 '양력'이라고 해."]],q:["비행기를 위로 띄우는 힘은?",["날개가 만드는 양력","바퀴의 힘","풍선의 힘"],0,"빠르게 달릴수록 양력이 커져서 하늘로 떠올라."]},
 {tp:4,t:"고인돌은 무엇일까?",s:[["🪨","큰 돌을 탁자처럼 올려놓은 '고인돌'은 아주 오래전 사람들의 무덤이야."],["🌏","세계 고인돌의 아주 많은 수가 우리나라에 있어."],["🏛️","고창, 화순, 강화의 고인돌은 세계 유산으로 지정되었어."]],q:["고인돌은 무엇으로 쓰였을까?",["옛날 사람들의 무덤","놀이터","집"],0,"무거운 돌을 옮기려면 많은 사람이 힘을 합쳐야 했어."]},
 {tp:4,t:"첨성대는 무엇을 하던 곳일까?",s:[["🏛️","경주에는 병 모양의 돌탑 '첨성대'가 있어."],["⭐","신라 선덕여왕 때 만들었고, 하늘의 별을 관측하던 곳으로 알려져 있어."],["🔭","지금 남아 있는 동아시아의 천문대 중 가장 오래된 것으로 꼽혀."]],q:["첨성대는 무엇을 한 곳으로 알려져 있을까?",["별 관측","물고기 기르기","쌀 보관"],0,"옛날 사람들도 하늘을 관찰하며 계절과 날씨를 알아냈어."]},
 {tp:4,t:"명량 해전은 어떻게 이겼을까?",s:[["⚓","이순신 장군은 명량에서 배 13척으로 훨씬 많은 적의 배와 싸웠어."],["🌊","명량은 물살이 아주 빠르고 좁은 바다야. 장군은 이 물길을 잘 알고 있었어."],["🧠","숫자가 적어도 장소와 때를 잘 이용해서 크게 이겼어. 체스처럼 전략이 중요했지!"]],q:["명량 해전에서 이길 수 있었던 비결은?",["빠른 물살과 지형을 잘 이용했다","배가 훨씬 많았다","적이 잠들어 있었다"],0,"적은 힘으로도 생각을 잘하면 이길 수 있다는 걸 보여 줬어."]},
 {tp:4,t:"옛날 사람들은 시계 없이 어떻게 시간을 알았을까?",s:[["☀️","세종대왕 때 '앙부일구'라는 해시계를 만들었어."],["🕳️","솥처럼 오목한 그릇 안에 바늘을 세워서, 바늘 그림자가 가리키는 곳으로 시각을 알았어."],["🐭","글을 모르는 백성도 볼 수 있게 시각마다 동물 그림을 넣었다고 해."]],q:["해시계는 무엇을 보고 시각을 알까?",["그림자","별빛","바람"],0,"해가 움직이면 그림자도 움직여서 시각을 알려 줘."]},
 {tp:4,t:"'모든 길은 로마로 통한다'는 무슨 뜻일까?",s:[["🏛️","옛날 로마 사람들은 아주 튼튼한 돌길을 나라 곳곳에 만들었어."],["🛣️","그 길이 모두 로마로 이어져 있어서 군대와 물건이 빠르게 오갔어."],["💬","그래서 '어떤 방법으로 해도 결국 같은 곳에 닿는다'는 뜻의 말이 생겼어."]],q:["로마 사람들이 길을 많이 만든 까닭은?",["사람과 물건이 빨리 오가게","예쁘게 꾸미려고","놀이를 하려고"],0,"길은 나라를 이어 주는 핏줄 같았어. 그중 일부는 지금도 남아 있어."]},
 {tp:4,t:"콜럼버스보다 먼저 아메리카에 간 사람들은?",s:[["⛵","바이킹은 북유럽의 뛰어난 뱃사람들이었어."],["🌊","약 1000년 전, 바이킹 레이프 에릭손은 바다를 건너 북아메리카에 도착했어."],["📅","콜럼버스보다 약 500년이나 먼저였어! 그 흔적이 캐나다에서 발견됐어."]],q:["콜럼버스보다 먼저 아메리카에 간 사람들은?",["바이킹","로마 사람","이집트 사람"],0,"캐나다에서 바이킹의 집터가 발견되었어."]},
 {tp:4,t:"종이는 어떻게 만들어졌을까?",s:[["📜","종이가 없던 때는 대나무, 비단, 동물 가죽에 글을 썼어."],["🌿","약 1900년 전 중국의 채륜이 나무껍질, 헝겊 등을 이용해 쓰기 좋은 종이를 만들었어."],["📚","종이 덕분에 책이 많아지고 지식이 널리 퍼졌어."]],q:["종이가 없던 때 글을 쓴 곳이 아닌 것은?",["태블릿","대나무","비단"],0,"태블릿은 아주 최근의 발명품이야!"]},
 {tp:4,t:"올림픽 오륜기의 다섯 고리는 무슨 뜻일까?",s:[["⭕","올림픽 깃발에는 고리 다섯 개가 서로 엮여 있어."],["🌍","다섯 고리는 세계의 다섯 대륙을 뜻해."],["🤝","서로 엮인 고리처럼 온 세계 사람들이 운동으로 하나가 되자는 뜻이야."]],q:["오륜기의 고리는 몇 개일까?",["5개","3개","7개"],0,"다섯 대륙이 손을 맞잡은 모습이야."]},
 {tp:4,t:"2월은 왜 가끔 29일까지 있을까?",s:[["📅","지구가 해를 한 바퀴 도는 데는 365일 하고도 약 6시간이 더 걸려."],["➕","6시간씩 4년이 모이면 24시간, 딱 하루가 돼."],["🗓️","그래서 4년에 한 번 2월 29일을 넣어. 이 해를 '윤년'이라고 해."]],q:["윤년은 몇 년마다 돌아올까?",["4년","1년","10년"],0,"6시간 × 4 = 24시간 = 하루!"]},
 {tp:4,t:"옛날 이집트 사람들은 어떻게 글을 썼을까?",s:[["📜","옛날 이집트 사람들은 그림처럼 생긴 글자 '상형 문자'를 썼어."],["🗿","오랫동안 아무도 읽지 못했는데, 같은 내용을 세 가지 글자로 쓴 '로제타석'이 발견되면서 풀렸어."],["🔐","아는 글자와 비교해서 모르는 글자를 풀어낸 거야. 암호 풀기와 같지!"]],q:["상형 문자를 읽는 데 도움이 된 것은?",["같은 내용을 여러 글자로 쓴 로제타석","망원경","나침반"],0,"아는 것과 비교해서 모르는 것을 알아내는 건 탐정의 방법이기도 해."]},
 {tp:5,t:"무지개는 어떻게 생길까?",s:[["🌈","비가 그친 뒤 해가 나면 무지개가 뜨기도 해."],["💧","햇빛이 공기 속 작은 물방울을 지나면서 꺾이고, 여러 색으로 나뉘어."],["☀️","그래서 무지개는 해를 등지고 서야 볼 수 있어. 분무기로 직접 만들어 볼 수도 있어!"]],q:["무지개를 보려면 해가 어디에 있어야 할까?",["내 등 뒤","내 눈앞","머리 바로 위"],0,"해를 등지고 물방울 쪽을 보면 무지개가 보여."]},
 {tp:5,t:"빨대로 음료를 어떻게 빨아 마실까?",s:[["🥤","빨대를 빨면 음료가 쭉 올라와."],["💨","빨대 속 공기를 빨아들이면 빨대 안의 공기가 줄어들어."],["⬆️","그러면 컵 위의 공기가 음료를 꾹 눌러서 빨대 위로 밀어 올려 줘. 공기의 힘이야!"]],q:["음료를 빨대 위로 밀어 올리는 것은?",["컵 위 공기가 누르는 힘","빨대의 자석","음료가 스스로"],0,"우리 주변 공기는 늘 모든 것을 누르고 있어."]},
 {tp:5,t:"겨울 길에 왜 소금 같은 것을 뿌릴까?",s:[["❄️","눈이 오면 길에 하얀 알갱이를 뿌리는 차를 볼 수 있어."],["🧂","소금 같은 물질이 섞인 물은 0도보다 더 추워야 얼어."],["🚗","그래서 길이 덜 얼어서 미끄러지지 않아. 바닷물이 잘 얼지 않는 것도 같은 까닭이야."]],q:["소금물은 맹물과 비교해서?",["더 추워야 언다","더 빨리 언다","얼지 않고 끓는다"],0,"소금이 물이 어는 것을 방해해."]},
 {tp:5,t:"풍선은 왜 하늘로 날아갈까?",s:[["🎈","놀이공원 풍선은 손을 놓으면 하늘로 날아가."],["🪶","이 풍선 안에는 공기보다 훨씬 가벼운 '헬륨'이 들어 있어."],["🫁","입으로 분 풍선은 내 숨이 들어 있어서 날아가지 않고 바닥으로 떨어져."]],q:["하늘로 날아가는 풍선에 든 것은?",["공기보다 가벼운 헬륨","물","모래"],0,"가벼운 것이 무거운 공기 위로 떠오르는 원리야."]},
 {tp:5,t:"빵은 어떻게 부풀까?",s:[["🍞","빵 반죽은 시간이 지나면 빵빵하게 부풀어."],["🦠","반죽 속의 '효모'라는 아주 작은 생물이 밀가루 속 당을 먹고 이산화탄소를 내뿜어."],["🫧","이 기체가 반죽 속에 작은 방울로 갇혀서 빵이 폭신폭신해져. 빵 속 구멍이 그 흔적이야."]],q:["빵을 부풀게 하는 작은 생물은?",["효모","개미","물고기"],0,"효모가 만든 기체 방울이 빵을 폭신하게 해."]},
 {tp:5,t:"그림자는 언제 가장 짧을까?",s:[["🌞","해가 낮게 뜬 아침과 저녁에는 그림자가 아주 길어."],["⬆️","한낮에는 해가 가장 높이 떠서 그림자가 가장 짧아져."],["📏","옛날 사람들은 이 원리로 해시계를 만들고, 그림자 길이로 피라미드 높이도 쟀다고 해."]],q:["그림자가 가장 짧은 때는?",["한낮","아침","저녁"],0,"해가 높을수록 그림자가 짧아져."]},
 {tp:5,t:"나침반은 왜 늘 북쪽을 가리킬까?",s:[["🧭","나침반 바늘은 어디서든 북쪽을 가리켜."],["🧲","바늘은 작은 자석이야. 그리고 지구 전체가 하나의 커다란 자석이야!"],["🗺️","그래서 바늘이 지구 자석에 끌려 북쪽을 가리켜. 옛날 뱃사람들은 나침반으로 길을 찾았어."]],q:["나침반 바늘이 북쪽을 가리키는 까닭은?",["지구가 커다란 자석이어서","바람이 불어서","해가 당겨서"],0,"지구라는 큰 자석이 작은 자석 바늘을 당겨."]},
 {tp:5,t:"메아리는 왜 생길까?",s:[["⛰️","산에서 '야호!' 하고 외치면 '야호' 하고 다시 들려."],["🔊","소리가 멀리 있는 산이나 벽에 부딪혀서 되돌아오는 거야."],["⏱️","메아리가 늦게 들릴수록 산이 멀리 있다는 뜻이야. 소리는 1초에 약 340m를 가."]],q:["메아리가 2초 뒤에 들리면 소리가 오간 거리는?",["약 680m","약 34m","약 3400m"],0,"340 × 2 = 680m를 오간 거야. 그럼 산까지는 그 절반인 약 340m!"]},
 {tp:5,t:"우유는 왜 하얄까?",s:[["🥛","물은 투명한데 우유는 하얘."],["🔬","우유 속에는 아주 작은 지방과 단백질 알갱이가 둥둥 떠 있어."],["💡","이 알갱이들이 빛을 사방으로 흩어서 하얗게 보여. 구름이 하얀 것과 비슷해."]],q:["우유가 하얗게 보이는 까닭은?",["작은 알갱이들이 빛을 흩어서","하얀 물감을 넣어서","소가 하얘서"],0,"빛을 골고루 흩으면 하얗게 보여."]},
 {tp:5,t:"겨울에 쇠 기둥을 혀로 핥으면 안 되는 까닭은?",s:[["🥶","아주 추운 날 쇠는 몹시 차가워져."],["👅","혀를 대면 침이 순식간에 얼어서 혀가 쇠에 딱 붙어 버려!"],["⚠️","억지로 떼면 다칠 수 있어. 그럴 땐 미지근한 물을 부어 녹여야 해. 처음부터 절대 하지 말자!"]],q:["추운 날 쇠에 혀를 대면?",["침이 얼어 혀가 붙는다","시원하고 맛있다","아무 일도 없다"],0,"쇠는 열을 아주 빨리 빼앗아서 침이 금방 얼어."]},
 {tp:6,t:"가장 큰 공룡은 얼마나 컸을까?",s:[["🦕","목이 긴 공룡 무리 중에는 엄청나게 큰 공룡이 있었어."],["📏","아르헨티노사우루스 같은 공룡은 길이가 30m도 넘었을 것으로 추정해. 버스 3대 길이야!"],["🐘","몸무게는 코끼리 10마리를 훌쩍 넘었을 거래."]],q:["가장 큰 공룡의 길이는 버스 몇 대쯤일까?",["약 3대","약 1대","약 30대"],0,"버스 한 대가 약 12m니까 30m는 버스 2대 반을 넘어!"]},
 {tp:6,t:"티라노사우루스는 얼마나 셌을까?",s:[["🦖","티라노사우루스는 가장 유명한 육식 공룡이야."],["🦷","이빨 하나가 바나나만큼 컸고, 무는 힘은 지금 살아 있는 어떤 육지 동물보다도 셌어."],["💪","그런데 앞발은 아주 짧았어. 손가락도 두 개뿐이었지."]],q:["티라노사우루스의 앞발은?",["아주 짧았다","아주 길었다","날개였다"],0,"큰 머리와 강한 턱이 무기였고, 앞발은 짧았어."]},
 {tp:6,t:"'공룡'이라는 이름은 무슨 뜻일까?",s:[["📖","공룡을 영어로 '다이노사우르'라고 해."],["😱","이 말은 '무서운 도마뱀'이라는 뜻이야."],["🔤","공룡 이름에는 뜻이 숨어 있어. '트리케라톱스'는 '뿔이 세 개 달린 얼굴'이라는 뜻이야."]],q:["'트리케라톱스'의 뜻은?",["뿔이 세 개 달린 얼굴","날개 달린 도마뱀","빠른 도둑"],0,"'트리'는 셋, '케라'는 뿔, '톱스'는 얼굴이라는 뜻이야."]},
 {tp:6,t:"익룡은 공룡일까?",s:[["🦅","공룡 시대 하늘을 날던 익룡, 다들 공룡이라고 생각하지?"],["❌","사실 익룡은 공룡과 가까운 친척이지만 공룡은 아니야."],["🌊","바다에 살던 커다란 수장룡과 어룡도 공룡이 아니야. 공룡은 땅 위에 살았어."]],q:["다음 중 공룡인 것은?",["티라노사우루스","익룡","수장룡"],0,"익룡과 수장룡은 같은 시대에 살았지만 공룡은 아니야."]},
 {tp:6,t:"공룡은 새끼를 어떻게 낳았을까?",s:[["🥚","공룡은 모두 알을 낳았어."],["🪺","어떤 공룡은 둥지를 만들고 알을 품었고, 새끼를 돌봤다는 흔적도 발견됐어."],["🐣","몸집이 엄청 큰 공룡도 알은 생각보다 작았어. 알이 너무 크면 껍데기가 두꺼워져서 새끼가 깨고 나오기 어렵거든."]],q:["공룡은 어떻게 새끼를 낳았을까?",["알을 낳았다","새끼를 바로 낳았다","씨앗으로 퍼졌다"],0,"공룡 알 화석은 우리나라에서도 발견됐어."]},
 {tp:6,t:"깃털이 있는 공룡도 있었을까?",s:[["🪶","영화 속 벨로키랍토르는 비늘만 있지?"],["🔍","하지만 화석을 보면 벨로키랍토르에게는 깃털이 있었어. 크기도 칠면조만 했어."],["🐦","많은 공룡에게 깃털이 있었고, 이것이 새가 공룡의 후손이라는 중요한 증거야."]],q:["벨로키랍토르의 몸에는 무엇이 있었을까?",["깃털","털가죽","껍데기"],0,"과학이 발전하면서 공룡의 모습도 계속 새로 밝혀지고 있어."]},
 {tp:6,t:"공룡 화석은 어떻게 만들어질까?",s:[["🦴","공룡이 죽은 뒤 몸이 진흙이나 모래에 빠르게 묻히면 화석이 될 수 있어."],["⏳","아주 오랜 시간이 지나면서 뼈 속에 광물이 스며들어 돌처럼 단단해져."],["⛏️","그래서 화석은 땅을 아주 조심스럽게 파서 찾아. 붓으로 흙을 살살 털어 내며!"]],q:["화석이 만들어지려면 무엇이 필요할까?",["아주 오랜 시간","하루","1년"],0,"수백만 년이 넘는 시간이 걸려."]},

LIB.forEach((c,i)=>{c.id="L"+i;});
function lCards(){
  const tp=LT.map((t,i)=>{const all=LIB.filter(c=>c.tp===i),n=all.filter(c=>M.lib[c.id]).length;return `<button class="tpb${n===all.length?" full":""}" data-t="${i}"><span>${t[0]}</span>${t[1]}<small>${n} / ${all.length}${n===all.length?" 🏅":""}</small></button>`;}).join("");
  box.innerHTML=`<div class="pt"><div class="face">📚</div><div class="bubble">어떤 지식이 궁금해? 주제를 고르면 아직 안 본 카드가 나와. 카드를 끝까지 보고 퀴즈를 맞히면 <b>지식 도감</b>에 모여!</div></div><div class="tpg">${tp}</div><button class="hbtn" id="rndc">🎲 아무 주제나 새 카드</button>`;
  box.querySelectorAll(".tpb").forEach(b=>b.onclick=()=>{SFX("pop");lNext(+b.dataset.t);});
  g("rndc").onclick=()=>{SFX("pop");lNext(-1);};
  g("pinfo").textContent=`지식 카드 ${Object.keys(M.lib).length} / ${LIB.length}장 모음`;
}
function lNext(tp){const pool=LIB.filter(c=>tp<0||c.tp===tp),un=pool.filter(c=>!M.lib[c.id]);lShow(pick(un.length?un:pool),0,tp);}
function lShow(c,i,tp){
  const T=LT[c.tp],last=i===c.s.length-1;afterFin=null;
  box.innerHTML=`<div class="kcard"><div class="ktop">${T[0]} ${T[1]}${M.lib[c.id]?" · 📗 도감에 있는 카드":""}</div><h3>${c.t}</h3><div class="kemo">${c.s[i][0]}</div><p>${c.s[i][1]}</p><div class="kdots">${c.s.map((_,j)=>`<i class="${j===i?"on":""}"></i>`).join("")}</div></div>
    <div class="arow">${i>0?`<button class="btn line" id="kp">⬅ 이전</button>`:`<button class="btn line" id="kl">📚 주제 고르기</button>`}<button class="btn" id="kn">${last?"🧩 퀴즈 풀기":"다음 ➜"}</button></div>`;
  if(g("kp"))g("kp").onclick=()=>{SFX("tick");lShow(c,i-1,tp);};
  if(g("kl"))g("kl").onclick=()=>{SFX("pop");lCards();};
  g("kn").onclick=()=>{SFX("tick");if(!last)lShow(c,i+1,tp);else lQuiz(c,tp);};
  g("pinfo").textContent=`${i+1} / ${c.s.length}장 · 넘겨 보면서 읽어 봐요`;
}
function lQuiz(c,tp){
  const isNew=!M.lib[c.id];
  afterFin=()=>{if(!M.lib[c.id]){M.lib[c.id]=stamp();save();const all=LIB.filter(x=>x.tp===c.tp);if(all.every(x=>M.lib[x.id]))setTimeout(()=>{star("l",LT[c.tp][1]+" 도감 완성",3);SFX("fanfare");toast(`🏅 ${LT[c.tp][0]} ${LT[c.tp][1]} 도감 완성!<small>보너스 별 3개</small>`);},700);}};
  mcq("l",`<div class="pt"><div class="face">${c.s[0][0]}</div><div class="bubble">${c.t}</div></div><div class="qtitle">${c.q[0]}</div>`,c.q[1],c.q[2],c.q[3]+(isNew?"<br>📗 이 카드가 지식 도감에 들어갔어!":""),()=>lNext(tp==null?-1:tp),"지식 카드: "+c.t);
  g("pinfo").textContent="퀴즈를 맞히면 카드가 도감에 들어가요.";
}
function lDex(){
  const n=Object.keys(M.lib).length;

  box.querySelectorAll(".dexc[data-id]").forEach(b=>b.onclick=()=>{SFX("pop");const c=LIB.find(x=>x.id===b.dataset.id);lShow(c,0,c.tp);});

      M.ends=M.ends||{};const first=!M.ends[dk];M.ends[dk]={mood:st.mood,fun:st.fun,hard:st.hard,msg:st.msg,at:stamp()};

        <div style="font-size:18px;line-height:1.6;margin:8px 0">오늘 ⭐ 별 ${e.s||0}개, ✏️ 문제 ${e.q||0}개! ${first?"마무리 별 ⭐ 1개도 받았어.":""}<br>엄마는 나중에 <b>📊 엄마</b> 버튼으로 오늘 한 일을 볼 수 있어.<br>이제 패드를 덮고 몸을 움직여 볼까? 👋</div><button class="hbtn" id="endOk">좋아!</button>`;

let rDay=null;
function reportText(dk){const el=document.createElement("div");el.innerHTML=g("rpBody").innerHTML;el.querySelectorAll("button,textarea,.tip,.noText").forEach(x=>x.remove());
  el.querySelectorAll("h3,h4,li,.bld,.chk,.tile,p,div.rl").forEach(x=>x.insertAdjacentText("afterend","\n"));return "📊 은준이 마을 보고서 "+dk+"\n"+el.textContent.replace(/[ \t]+/g," ").replace(/\n\s*\n+/g,"\n").trim();}
function rReport(){
  const td=day(),DY=M.days||{};let dn=rDay==null?td:rDay;
  const days=Object.keys(DY).map(Number).filter(x=>x<=td).sort((a,b)=>b-a).slice(0,7);if(!days.includes(td))days.unshift(td);

  const sec=Math.max(E.sec||0,isT&&M.act&&M.act.d===td?M.act.sec:0);
  const byK={};logs.forEach(l=>{(byK[l.k]=byK[l.k]||[]).push(l);});
  const ks=Object.keys(byK).filter(k=>PL[k]).sort((a,b)=>byK[b].length-byK[a].length);

  const whys=(M.why||[]).filter(x=>onDay(x,dk));
  const ALLM=MS.concat(BM);const recs=[];ALLM.forEach(m=>{const h=M.rec[m.id]||[];h.forEach((r,i)=>{if(!onDay(r,dk)||i===0)return;const prev=h.slice(0,i).map(x=>x.v),best=m.low?Math.min.apply(null,prev):Math.max.apply(null,prev);if(m.low?r.v<best:r.v>best)recs.push(`${m.e} ${m.t} ${best}${m.u} → ${r.v}${m.u}`);});});
  const good=[];
  if(lvs.length)good.push("단계가 올라갔어요: "+lvs.map(x=>`${PL[x.k].emoji} ${PL[x.k].map} ${x.L}단계`).join(", "));

  if(whys.filter(w=>w.t).length)good.push(`정답 없는 질문에 자기 생각을 ${whys.filter(w=>w.t).length}번 적었어요`);
  if(chks.length)good.push(`몸 미션을 스스로 ${chks.length}번 했어요`);
  if(end)good.push("스스로 '오늘 마무리'까지 했어요 🏁");
  const talk=[];

  shuffle(cards).slice(0,3).forEach(c=>talk.push(`📚 "${esc(c.t)}" 카드를 봤어요. 은준이에게 설명해 달라고 해 보세요.`));

    :`<div class="noText">${isT?"아직 '오늘 마무리'를 하지 않았어요. 지금까지 한 것만 보여요.":"이날은 '오늘 마무리'를 하지 않았어요."}</div>`;
  box.innerHTML=`<div class="rp">
    <div class="rdays">${days.map(x=>`<button data-day="${x}" class="${x===dn?"on":""}">${x===td?"오늘":dKey(x)}</button>`).join("")}</div>

    <div class="sec"><h4>🏘️ 어디서 무엇을 했나 ${span?`<small style="font-size:14px;color:#8a91a8">(${span})</small>`:""}</h4>${ks.length?ks.map(k=>{const L=byK[k],w=[...new Set(L.map(l=>String(l.what).replace(/<[^>]*>/g,"")))];return `<div class="bld"><span>${PL[k].emoji}</span><b>${PL[k].map}</b><span>${L.length}번</span><small>${esc(w.slice(0,4).join(" · "))}${w.length>4?` 외 ${w.length-4}가지`:""}</small></div>`;}).join(""):`<div class="empty">아직 한 활동이 없어요.</div>`}</div>
    <div class="sec"><h4>🌟 잘한 점</h4>${good.length?`<ul>${good.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<div class="empty">활동을 하면 여기에 잘한 점이 모여요.</div>`}</div>
    <div class="sec"><h4>🔁 여러 번 시도한 문제</h4>${miss.length?`<ul>${miss.slice(-8).map(x=>`<li>${PL[x.k]?PL[x.k].emoji:""} ${esc(x.what)} <small style="color:#8a91a8">(${x.w}번 틀리고 해결)</small></li>`).join("")}</ul><div class="tip">끝까지 다시 생각해서 풀었어요. 답을 알려 주기보다 "어떻게 생각했어?"라고 물어봐 주세요.</div>`:`<div class="empty">두 번 넘게 틀린 문제는 없었어요.</div>`}</div>
    <div class="sec"><h4>🏃 몸 미션 · 은준이가 스스로 확인</h4>${chks.length?chks.map((x,i)=>`<div class="chk"><span>${esc(x.t)} <small style="color:#8a91a8">${tm(x)}</small></span><button data-ck="${(M.chk||[]).indexOf(x)}" class="${x.ok?"on":""}">${x.ok?"👍 확인함":"👍 확인"}</button></div>`).join("")+(chks.some(x=>!x.ok)?`<div class="arow"><button class="btn line" id="ckAll">👍 모두 확인</button></div>`:"")+`<div class="tip">누르지 않아도 별은 이미 받았어요. 확인해 주면 은준이가 다음에 들어올 때 '엄마 확인 도장'을 보게 돼요.</div>`:`<div class="empty">이날 한 몸 미션은 없어요.</div>`}</div>
    <div class="sec"><h4>💬 저녁 대화거리</h4>${talk.length?`<ul>${talk.slice(0,6).map(x=>`<li>${x}</li>`).join("")}</ul>`:`<div class="empty">생각 다리나 도서관에 다녀오면 대화거리가 생겨요.</div>`}</div>
    <div class="sec"><h4>✉️ 은준이에게 한마디</h4><textarea id="rpMail" placeholder="잘한 점, 응원하는 말을 적어 주세요. 다음에 들어오면 편지로 도착해요."></textarea><div class="arow"><button class="btn" id="rpSend">편지 보내기</button><span id="rpSent" class="tip"></span></div></div>
    <div class="arow" style="margin-top:12px"><button class="btn line" id="rpCopy">📋 보고서 글로 복사 (아빠에게 보내기)</button></div><textarea id="rpTxt" hidden readonly></textarea>
  </div>`;
  box.querySelector(".rp").id="rpBody";
  box.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{rDay=+b.dataset.day;SFX("tick");rReport();});
  box.querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>{const x=M.chk[+b.dataset.ck];if(!x)return;x.ok=x.ok?0:1;save();SFX(x.ok?"stamp":"tick");rReport();});

  g("rpCopy").onclick=()=>{const t=reportText(dk),ta=g("rpTxt");const done=()=>{g("rpCopy").textContent="✅ 복사했어요. 카톡에 붙여 넣으세요";};
    const fb=()=>{ta.hidden=false;ta.value=t;ta.style.cssText="width:100%;min-height:160px;margin-top:8px";ta.focus();ta.select();g("rpCopy").textContent="아래 글을 길게 눌러 복사하세요";};
    try{navigator.clipboard.writeText(t).then(done,fb);}catch(e){fb();}};
  g("pinfo").textContent="은준이가 혼자 한 일을 한눈에 봐요. 날짜를 누르면 지난 기록도 볼 수 있어요.";
}
function momSeen(){const n=(M.chk||[]).filter(x=>x.ok&&!x.seen);if(!n.length)return;n.forEach(x=>x.seen=1);save();setTimeout(()=>{SFX("stamp");toast(`👍 엄마 확인 도장 ${n.length}개!<small>엄마가 은준이 몸 미션을 확인했어요</small>`);},900);}
